name: FIELDERR Integrate

on:
  push:
    branches:
      - agent/field-delivery-timeout-recovery
    paths:
      - 'scripts/apply-field-delivery-timeout-recovery.py'
      - 'scripts/prepare-field-delivery-timeout-patch.py'
      - '.github/workflows/field-delivery-timeout-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/field-delivery-timeout-recovery
          fetch-depth: 0
      - name: Prepare deterministic selector
        run: python scripts/prepare-field-delivery-timeout-patch.py
      - name: Apply FIELDERR integration
        run: python scripts/apply-field-delivery-timeout-recovery.py
      - name: Commit integrated source and regression tests
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/GPTDeskTop/Services/ChromeDevToolsSessionPool.cs \
            src/GPTDeskTop/Services/ChromeDevToolsService.cs \
            src/GPTDeskTop/Services/ChatGptMonitorService.cs \
            src/GPTDeskTop/Services/RuntimeInspectorService.cs \
            tests/GPTDeskTop.RuntimeTests/FieldDeliveryTimeoutRecoveryRegressionTests.cs
          git commit -m 'FIELDERR recover rendered delivery timeout and preserve flight history'
          git push origin HEAD:agent/field-delivery-timeout-recovery
