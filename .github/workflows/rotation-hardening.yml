name: Rotation Hardening

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  harden:
    if: "!contains(github.event.head_commit.message, '[rotation-hardening]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch Chrome readiness API
        shell: pwsh
        run: |
          $p = 'src/GPTDeskTop/Services/ChromeDevToolsService.cs'
          $s = Get-Content $p -Raw
          if ($s -notmatch 'WaitForChatReadyAsync') {
            $marker = '    public async Task<bool> SendChatMessageAsync('
            $method = @'
              public async Task<bool> WaitForChatReadyAsync(ChromeTab tab, CancellationToken cancellationToken = default)
              {
                  for (var attempt = 0; attempt < 30; attempt++)
                  {
                      cancellationToken.ThrowIfCancellationRequested();
                      try
                      {
                          var state = await GetChatStateAsync(tab, cancellationToken);
                          var ready = state.AssistantCount >= 0;
                          if (ready)
                          {
                              var expression = "(() => { const e=document.querySelector('#prompt-textarea') || document.querySelector('textarea[placeholder]') || document.querySelector('[contenteditable=\"true\"]'); return !!e; })()";
                              var value = await EvaluateAsync(tab, expression, cancellationToken, awaitPromise: false);
                              if (value.ValueKind == JsonValueKind.True) return true;
                          }
                      }
                      catch (Exception ex) when (ex is not OperationCanceledException)
                      {
                          // New tabs can expose CDP before the ChatGPT composer is initialized.
                      }
                      await Task.Delay(500, cancellationToken);
                  }
                  return false;
              }

'@
            $s = $s.Replace($marker, $method + $marker)
            Set-Content $p $s -Encoding UTF8
          }

      - name: Patch rotation and recovery sends
        shell: pwsh
        run: |
          $p = 'src/GPTDeskTop/Services/ChatGptMonitorService.cs'
          $s = Get-Content $p -Raw
          $old = '                        await Task.Delay(TimeSpan.FromSeconds(2), cancellationToken);\n\n                        await ApplyModelRouteAsync(monitor, newTab, recovery: false, contextRotation: true, cancellationToken);'
          $new = '                        if (!await _chrome.WaitForChatReadyAsync(newTab, cancellationToken))\n                            throw new TimeoutException("New ChatGPT conversation did not expose a ready composer.");\n\n                        await ApplyModelRouteAsync(monitor, newTab, recovery: false, contextRotation: true, cancellationToken);'
          if ($s.Contains($old)) { $s = $s.Replace($old, $new, 1) }
          $old2 = '                        var sent = await _chrome.SendChatMessageAsync(newTab, startMessage, cancellationToken);'
          $new2 = '                        var sent = await _chrome.SendChatMessageAsync(newTab, startMessage, cancellationToken);'
          # Keep the send single-shot; readiness verification prevents premature duplicate sends.
          if (-not $s.Contains($new2)) { throw 'Rotation send block not found.' }
          Set-Content $p $s -Encoding UTF8

      - name: Patch recovery chat readiness
        shell: pwsh
        run: |
          $p = 'src/GPTDeskTop/Services/ChatGptMonitorService.cs'
          $s = Get-Content $p -Raw
          $needle = '                        var sent = await _chrome.SendChatMessageAsync(newTab, recoveryMessage, cancellationToken);'
          $replacement = '                        if (!await _chrome.WaitForChatReadyAsync(newTab, cancellationToken))\n                            throw new TimeoutException("Recovery ChatGPT conversation did not expose a ready composer.");\n\n                        var sent = await _chrome.SendChatMessageAsync(newTab, recoveryMessage, cancellationToken);'
          if ($s.Contains($needle) -and -not $s.Contains('Recovery ChatGPT conversation did not expose a ready composer.')) { $s = $s.Replace($needle, $replacement, 1) }
          Set-Content $p $s -Encoding UTF8

      - name: Validate
        run: dotnet build GPTDeskTop.sln -c Release

      - name: Commit
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GPTDeskTop/Services/ChromeDevToolsService.cs src/GPTDeskTop/Services/ChatGptMonitorService.cs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'fix: wait for ChatGPT composer before rotation sends [rotation-hardening]'
          git push

      - name: Remove one-shot workflow
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/rotation-hardening.yml
          git commit -m 'chore: remove one-shot rotation hardening workflow [rotation-hardening]'
          git push
