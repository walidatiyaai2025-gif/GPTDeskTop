name: V2035 Single Chrome Ownership Patch

on:
  push:
    branches:
      - fix/v2035-monitor-pacing
    paths:
      - .github/workflows/v2035-single-chrome-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2035-monitor-pacing
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Correct single-Chrome generator
        shell: pwsh
        run: python tools/v2035_single_chrome_prepare.py

      - name: Apply single-Chrome ownership patch
        shell: pwsh
        run: python tools/v2035_single_chrome_patch.py

      - name: Runtime regression tests
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --nologo

      - name: Build application
        shell: pwsh
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release --nologo

      - name: Commit validated source and tests only
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GPTDeskTop/Services/SimpleMonitorProfileSession.cs
          git add src/GPTDeskTop/Services/SimpleMonitorSafetyGate.cs
          git add src/GPTDeskTop/Services/SimpleMonitorChromeOwnershipGate.cs
          git add tests/GPTDeskTop.RuntimeTests/SimpleMonitorSingleChromeOwnershipRegressionTests.cs
          git diff --cached --check
          git commit -m "fix: enforce one GPTDeskTop Chrome before every send"
          git push origin HEAD:fix/v2035-monitor-pacing
