name: Build GPTDeskTop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore GPTDeskTop.sln
      - name: Restore runtime tests
        run: dotnet restore tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -p:EnableWindowsTargeting=true
      - name: Runtime automation tests
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj --configuration Release --no-restore --verbosity normal -p:EnableWindowsTargeting=true
      - name: Validate development task lifecycle invariants
        shell: pwsh
        run: |
          $engine = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskEngine.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskEngineEmissionTests.cs -Raw
          if ($engine -notmatch '_lastEmittedMessageIndex') { throw 'Message emission checkpoint guard is missing.' }
          if ($engine -notmatch '_lastEmittedMessageIndex = null') { throw 'Emission guard reset is missing.' }
          if ($engine -notmatch 'TimeSpan.FromMinutes\(10\)') { throw 'Default 10-minute work window is missing.' }
          if ($engine -notmatch 'TimeSpan.FromMinutes\(5\)') { throw 'Default 5-minute cooling window is missing.' }
          if ($engine -notmatch 'CoolingStarted') { throw 'Cooling transition event is missing.' }
          if ($engine -notmatch 'CoolingCompleted') { throw 'Cooling completion event is missing.' }
          if ($tests -notmatch 'CurrentMessageIsEmittedOnceUntilExplicitAdvance') { throw 'Single-emission regression test is missing.' }
          if ($tests -notmatch 'WorkWindowTransitionsToCoolingAndThenBackToWorking') { throw 'Work/cooling lifecycle regression test is missing.' }
          Write-Host 'Development task lifecycle invariants passed.'
      - name: Validate CDP delivery reliability invariants
        shell: pwsh
        run: |
          $chrome = Get-Content src/GPTDeskTop/Services/ChromeDevToolsService.cs -Raw
          $monitor = Get-Content src/GPTDeskTop/Services/ChatGptMonitorService.cs -Raw
          if ($chrome -notmatch 'Promise was collected') { throw 'Transient Promise-collected retry handling is missing.' }
          if ($chrome -notmatch 'attempt <= 3') { throw 'Runtime.evaluate retry bound is missing.' }
          if ($chrome -notmatch 'GetUserMessageSnapshotAsync') { throw 'Verified-send snapshot guard is missing.' }
          if ($chrome -notmatch 'current\.Count > before\.Count') { throw 'Verified-send pre-send duplicate guard is missing.' }
          if ($chrome -notmatch 'after\.Count > before\.Count') { throw 'Verified-send post-send receipt check is missing.' }
          if ($monitor -notmatch 'SendChatMessageVerifiedAsync') { throw 'Monitor worker is not using verified delivery.' }
      - name: Validate crash recovery invariants
        shell: pwsh
        run: |
          $recovery = Get-Content src/GPTDeskTop/Services/CrashRecoveryService.cs -Raw
          $state = Get-Content src/GPTDeskTop/Services/CrashRecoveryStateService.cs -Raw
          $policy = Get-Content src/GPTDeskTop/Services/CrashRecoveryOutcomePolicy.cs -Raw
          if ($recovery -notmatch 'CrashRecoveryPending') { throw 'Crash recovery pending marker is missing.' }
          if ($recovery -notmatch 'CloseAllMonitorTabsAsync') { throw 'Recovery does not close stale monitor tabs.' }
          if ($recovery -notmatch 'LaunchMonitorChrome') { throw 'Recovery does not relaunch monitor Chrome.' }
          if ($recovery -notmatch 'SendChatMessageVerifiedAsync') { throw 'Recovery message is not verified before success.' }
          if ($recovery -notmatch 'CrashRecoverySendFailed') { throw 'Recovery send failure is not logged.' }
          if ($recovery -notmatch 'SetSettingAsync\("CrashRecoveryPending",\s*"0"') { throw 'Recovery success does not clear the pending marker.' }
          if ($state -notmatch 'SetSettingAsync\("CrashRecoveryPending",\s*"1"') { throw 'Startup does not persist the recovery pending marker.' }
          if ($state -notmatch 'CrashRecovery\.RecoveryId') { throw 'Startup recovery incident identity is missing.' }
          if ($recovery -notmatch 'CrashRecovery\.\{recoveryId\}\.Monitor\.\{saved\.Id\}\.Success') { throw 'Per-monitor recovery idempotency marker is missing.' }
          if ($recovery -notmatch 'CrashRecoveryAlreadyVerified') { throw 'Already-recovered monitor path is missing.' }
          if ($recovery -notmatch 'StartMonitorAsync') { throw 'Recovered monitors are not restarted.' }
          if ($policy -notmatch 'outcomes\.All\(x => x == CrashRecoveryOutcome\.Success\)') { throw 'Pending-clear policy is missing all-success requirement.' }
      - name: Validate multi-monitor recovery invariants
        shell: pwsh
        run: |
          $recovery = Get-Content src/GPTDeskTop/Services/CrashRecoveryService.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/CrashRecoveryMultiMonitorTests.cs -Raw
          if ($recovery -notmatch 'alreadyRecovered') { throw 'Already-recovered monitor guard is missing.' }
          if ($recovery -notmatch 'CrashRecoveryAlreadyVerified') { throw 'Already-verified recovery path is missing.' }
          if ($recovery -notmatch 'if \(saved\.Enabled\)') { throw 'Recovered enabled monitors are not conditionally restarted.' }
          if ($recovery -notmatch 'CrashRecoveryPartialFailure') { throw 'Partial recovery is not logged.' }
          if ($recovery -notmatch 'CrashRecovery\.\{recoveryId\}\.Monitor\.\{saved\.Id\}\.Success') { throw 'Per-monitor success marker is missing.' }
          if ($tests -notmatch 'PartialFailureKeepsSuccessfulMonitorIdempotentOnRetry') { throw 'Partial-failure regression test is missing.' }
          if ($tests -notmatch 'OneFailedMonitorMustNotPreventAnotherSuccessfulMonitorFromStarting') { throw 'Monitor isolation regression test is missing.' }
      - name: Build application
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj --configuration Release --no-restore
      - name: Build setup
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj --configuration Release --no-restore
      - name: Build helper
        run: dotnet build src/GPTDeskTop.Build/GPTDeskTop.Build.csproj --configuration Release --no-restore
      - name: Validate rotation safety invariants
        shell: pwsh
        run: |
          $file = Get-Content src/GPTDeskTop/Services/ChatGptMonitorService.cs -Raw
          if ($file -notmatch 'ConversationHandoffService') { throw 'Conversation handoff integration is missing.' }
          if ($file -notmatch 'CreateNewChatTabAsync') { throw 'Conversation rotation is missing.' }
          if ($file -notmatch 'if \(!sent\)') { throw 'New-chat send result is not validated.' }
          if ($file -notmatch 'CloseTabAsync\(oldTab') { throw 'Old chat is not closed after successful rotation.' }
