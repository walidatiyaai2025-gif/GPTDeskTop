name: Build GPTDeskTop

on:
  push:
    branches: [ main, fix/setup-payload-validation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GPTDeskTop.sln

      - name: Runtime automation tests
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj --configuration Release --no-restore --verbosity normal

      - name: Build application
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj --configuration Release --no-restore

      - name: Build setup
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj --configuration Release --no-restore

      - name: Build helper
        run: dotnet build src/GPTDeskTop.Build/GPTDeskTop.Build.csproj --configuration Release --no-restore

      - name: Validate release payload
        shell: pwsh
        run: |
          $publish = Join-Path $PWD 'Output/Publish'
          $setup = Join-Path $PWD 'Output/Setup/GPTDeskTop-Setup.exe'
          $required = @(
            (Join-Path $publish 'GPTDeskTop.exe'),
            (Join-Path $publish 'task-messages.json')
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required release payload is missing: $path" }
          }
          if (-not (Test-Path $setup)) { throw "Standalone setup is missing: $setup" }
          if ((Get-Item $setup).Length -le 0) { throw 'Standalone setup is empty.' }
          Write-Host 'Release payload validation passed.'

      - name: Validate rotation safety invariants
        shell: pwsh
        run: |
          $file = Get-Content src/GPTDeskTop/Services/ChatGptMonitorService.cs -Raw
          if ($file -notmatch 'ConversationHandoffService') { throw 'Conversation handoff integration is missing.' }
          if ($file -notmatch 'CreateNewChatTabAsync') { throw 'Conversation rotation is missing.' }
          if ($file -notmatch 'if \(!sent\)') { throw 'New-chat send result is not validated.' }
          if ($file -notmatch 'CloseTabAsync\(oldTab') { throw 'Old chat is not closed after successful rotation.' }
          Write-Host 'Rotation safety invariants passed.'

      - name: Package release
        shell: pwsh
        run: |
          $publish = Join-Path $PWD 'Output/Publish'
          $setup = Join-Path $PWD 'Output/Setup/GPTDeskTop-Setup.exe'
          $release = Join-Path $PWD 'Output/Release'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item $setup (Join-Path $release 'GPTDeskTop-Setup.exe') -Force
          Copy-Item (Join-Path $publish 'GPTDeskTop.exe') (Join-Path $release 'GPTDeskTop.exe') -Force
          Copy-Item (Join-Path $publish 'task-messages.json') (Join-Path $release 'task-messages.json') -Force
          if (Test-Path (Join-Path $publish 'appsettings.json')) { Copy-Item (Join-Path $publish 'appsettings.json') (Join-Path $release 'appsettings.json') -Force }
          $version = (Get-Item $setup).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '1.8.1' }
          Set-Content (Join-Path $release 'Version.txt') "GPTDeskTop $version" -Encoding UTF8
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath (Join-Path $PWD 'Output/GPTDeskTop-Release.zip') -Force
          if (-not (Test-Path (Join-Path $PWD 'Output/GPTDeskTop-Release.zip'))) { throw 'Release ZIP was not created.' }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-Release
          path: Output/GPTDeskTop-Release.zip
          if-no-files-found: error
          retention-days: 14
