name: Build GPTDeskTop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore GPTDeskTop.sln
      - name: Restore runtime tests
        run: dotnet restore tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -p:EnableWindowsTargeting=true
      - name: Validate editable development message catalog
        shell: pwsh
        run: |
          $catalog = Get-Content data/development-task-messages.json -Raw | ConvertFrom-Json
          if ($null -eq $catalog.messages) { throw 'Development message catalog is missing messages.' }
          if ($catalog.messages.Count -ne 10) { throw "Expected exactly 10 development messages, found $($catalog.messages.Count)." }
          if (($catalog.messages | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) { throw 'Development message catalog contains an empty message.' }
      - name: Runtime automation tests
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj --configuration Release --no-restore --verbosity normal -p:EnableWindowsTargeting=true
      - name: Validate development task delivery invariants
        shell: pwsh
        run: |
          $engine = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskEngine.cs -Raw
          $coordinator = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskDeliveryCoordinator.cs -Raw
          $bridge = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/MonitorDevelopmentTaskBridge.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskDeliveryCoordinatorTests.cs -Raw
          if ($engine -notmatch 'MessageReady') { throw 'Development task message emission is missing.' }
          if ($engine -notmatch '_lastEmittedMessageIndex') { throw 'Duplicate task-message guard is missing.' }
          if ($coordinator -notmatch '_verifiedSender') { throw 'Verified delivery callback is missing.' }
          if ($coordinator -notmatch 'if \(!sent\)') { throw 'Task advancement is not gated on verified send success.' }
          if ($coordinator -notmatch 'await _engine\.AdvanceAsync\(\)') { throw 'Successful delivery does not advance the task.' }
          if ($bridge -notmatch 'IsMonitorRunning') { throw 'Development task bridge is not bound to the active Monitor.' }
          if ($bridge -notmatch 'SendChatMessageVerifiedAsync') { throw 'Development task bridge is not using verified CDP delivery.' }
          if ($tests -notmatch 'FailedDeliveryDoesNotAdvanceTask') { throw 'Failed-delivery regression test is missing.' }
          if ($tests -notmatch 'SuccessfulDeliveryAdvancesExactlyOnce') { throw 'Successful-delivery regression test is missing.' }
      - name: Validate multi-monitor development delivery
        shell: pwsh
        run: |
          $state = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskState.cs -Raw
          $coordinator = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskMultiMonitorDeliveryCoordinator.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskMultiMonitorDeliveryTests.cs -Raw
          if ($state -notmatch 'DeliveryReceipts') { throw 'Per-monitor development delivery receipts are missing.' }
          if ($state -notmatch 'DevelopmentTaskDeliveryReceipt') { throw 'Development delivery receipt model is missing.' }
          if ($coordinator -notmatch 'every recovered monitor') { throw 'Multi-monitor coordinator documentation is missing.' }
          if ($coordinator -notmatch 'allDelivered') { throw 'All-recipient delivery gate is missing.' }
          if ($coordinator -notmatch 'await _engine\.AdvanceAsync\(\)') { throw 'Multi-monitor delivery does not advance only after all recipients.' }
          if ($coordinator -notmatch 'MessageIndex == messageIndex') { throw 'Per-monitor message-index idempotency guard is missing.' }
          if ($tests -notmatch 'PartialDeliveryKeepsSuccessfulRecipientReceiptForRetry') { throw 'Partial multi-monitor receipt test is missing.' }
          if ($tests -notmatch 'DifferentTabInvalidatesPreviousReceiptForSameMonitor') { throw 'Tab-change receipt invalidation test is missing.' }
      - name: Validate saved monitor chat rebinding
        shell: pwsh
        run: |
          $resolver = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/SavedMonitorTabResolver.cs -Raw
          $factory = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskMonitorTargetFactory.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/SavedMonitorTabResolverTests.cs -Raw
          if ($resolver -notmatch 'PersistedTabId') { throw 'Exact persisted Chrome target binding is missing.' }
          if ($resolver -notmatch 'PersistedConversationUrl') { throw 'Conversation URL rebinding fallback is missing.' }
          if ($resolver -notmatch 'Title is intentionally not used') { throw 'Resolver uniqueness rule documentation is missing.' }
          if ($factory -notmatch 'ResolveEnabledRecipientsAsync') { throw 'Saved monitor recipient factory is missing.' }
          if ($factory -notmatch 'DevelopmentMonitorRebound') { throw 'Monitor rebind event logging is missing.' }
          if ($factory -notmatch 'DevelopmentMonitorTabUnavailable') { throw 'Missing-chat state is not logged.' }
          if ($tests -notmatch 'ExactPersistedTabIdWins') { throw 'Exact-tab rebinding test is missing.' }
          if ($tests -notmatch 'RecreatedChromeTargetCanBeRecoveredByConversationUrl') { throw 'Restart URL rebinding test is missing.' }
          if ($tests -notmatch 'MissingConversationDoesNotFallBackToTitle') { throw 'Unsafe title fallback regression test is missing.' }
      - name: Validate CDP delivery reliability invariants
        shell: pwsh
        run: |
          $chrome = Get-Content src/GPTDeskTop/Services/ChromeDevToolsService.cs -Raw
          $monitor = Get-Content src/GPTDeskTop/Services/ChatGptMonitorService.cs -Raw
          if ($chrome -notmatch 'Promise was collected') { throw 'Transient Promise-collected retry handling is missing.' }
          if ($chrome -notmatch 'attempt <= 3') { throw 'Runtime.evaluate retry bound is missing.' }
          if ($chrome -notmatch 'GetUserMessageSnapshotAsync') { throw 'Verified-send snapshot guard is missing.' }
          if ($chrome -notmatch 'current\.Count > before\.Count') { throw 'Verified-send pre-send duplicate guard is missing.' }
          if ($chrome -notmatch 'after\.Count > before\.Count') { throw 'Verified-send post-send receipt check is missing.' }
          if ($monitor -notmatch 'SendChatMessageVerifiedAsync') { throw 'Monitor worker is not using verified delivery.' }
      - name: Validate crash recovery invariants
        shell: pwsh
        run: |
          $recovery = Get-Content src/GPTDeskTop/Services/CrashRecoveryService.cs -Raw
          $state = Get-Content src/GPTDeskTop/Services/CrashRecoveryStateService.cs -Raw
          $policy = Get-Content src/GPTDeskTop/Services/CrashRecoveryOutcomePolicy.cs -Raw
          if ($recovery -notmatch 'CrashRecoveryPending') { throw 'Crash recovery pending marker is missing.' }
          if ($recovery -notmatch 'CloseAllMonitorTabsAsync') { throw 'Recovery does not close stale monitor tabs.' }
          if ($recovery -notmatch 'LaunchMonitorChrome') { throw 'Recovery does not relaunch monitor Chrome.' }
          if ($recovery -notmatch 'SendChatMessageVerifiedAsync') { throw 'Recovery message is not verified before success.' }
          if ($recovery -notmatch 'CrashRecoverySendFailed') { throw 'Recovery send failure is not logged.' }
          if ($recovery -notmatch 'SetSettingAsync\("CrashRecoveryPending",\s*"0"') { throw 'Recovery success does not clear the pending marker.' }
          if ($state -notmatch 'SetSettingAsync\("CrashRecoveryPending",\s*"1"') { throw 'Startup does not persist the recovery pending marker.' }
          if ($state -notmatch 'CrashRecovery\.RecoveryId') { throw 'Startup recovery incident identity is missing.' }
          if ($recovery -notmatch 'CrashRecovery\.\{recoveryId\}\.Monitor\.\{saved\.Id\}\.Success') { throw 'Per-monitor recovery idempotency marker is missing.' }
          if ($recovery -notmatch 'CrashRecoveryAlreadyVerified') { throw 'Already-recovered monitor path is missing.' }
          if ($recovery -notmatch 'StartMonitorAsync') { throw 'Recovered monitors are not restarted.' }
          if ($policy -notmatch 'outcomes\.All\(x => x == CrashRecoveryOutcome\.Success\)') { throw 'Pending-clear policy is missing all-success requirement.' }
      - name: Build application
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj --configuration Release --no-restore
      - name: Build setup
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj --configuration Release --no-restore
      - name: Build helper
        run: dotnet build src/GPTDeskTop.Build/GPTDeskTop.Build.csproj --configuration Release --no-restore
      - name: Validate rotation safety invariants
        shell: pwsh
        run: |
          $file = Get-Content src/GPTDeskTop/Services/ChatGptMonitorService.cs -Raw
          if ($file -notmatch 'ConversationHandoffService') { throw 'Conversation handoff integration is missing.' }
          if ($file -notmatch 'CreateNewChatTabAsync') { throw 'Conversation rotation is missing.' }
          if ($file -notmatch 'if \(!sent\)') { throw 'New-chat send result is not validated.' }
          if ($file -notmatch 'CloseTabAsync\(oldTab') { throw 'Old chat is not closed after successful rotation.' }
