name: Build GPTDeskTop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore GPTDeskTop.sln
      - name: Restore runtime tests
        run: dotnet restore tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -p:EnableWindowsTargeting=true
      - name: Validate editable development message catalog
        shell: pwsh
        run: |
          $catalog = Get-Content data/development-task-messages.json -Raw | ConvertFrom-Json
          if ($null -eq $catalog.messages) { throw 'Development message catalog is missing messages.' }
          if ($catalog.messages.Count -lt 10) { throw "Expected at least 10 development messages, found $($catalog.messages.Count)." }
          if (($catalog.messages | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) { throw 'Development message catalog contains an empty message.' }
      - name: Validate development schedule settings
        shell: pwsh
        run: |
          $settings = Get-Content data/development-task-settings.json -Raw | ConvertFrom-Json
          if ($settings.WorkMinutes -lt 1 -or $settings.WorkMinutes -gt 120) { throw 'WorkMinutes is outside the allowed range.' }
          if ($settings.CoolingMinutes -lt 1 -or $settings.CoolingMinutes -gt 120) { throw 'CoolingMinutes is outside the allowed range.' }
          $engine = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskEngine.cs -Raw
          $control = Get-Content src/GPTDeskTop/UI/DevelopmentTaskScheduleSettingsControl.cs -Raw
          $dashboard = Get-Content src/GPTDeskTop/UI/DevelopmentTaskDashboardControl.cs -Raw
          if ($engine -notmatch 'DevelopmentTaskScheduleSettingsStore') { throw 'Engine is not using persisted schedule settings.' }
          if ($engine -notmatch 'ReloadScheduleSettings') { throw 'Engine schedule reload is missing.' }
          if ($engine -notmatch 'CoolingCompleted') { throw 'Cooling completion hook is missing.' }
          if ($control -notmatch 'Work window \(minutes\)') { throw 'Work schedule control is missing.' }
          if ($control -notmatch 'Cooling window \(minutes\)') { throw 'Cooling schedule control is missing.' }
          if ($control -notmatch 'next cycle') { throw 'Schedule control does not communicate next-cycle behavior.' }
          if ($dashboard -notmatch 'DevelopmentTaskScheduleSettingsControl') { throw 'Dashboard schedule control is missing.' }
          if ($dashboard -notmatch 'Engine.WorkWindow') { throw 'Dashboard is not using configured work duration.' }
          if ($dashboard -notmatch 'Engine.CoolingWindow') { throw 'Dashboard is not using configured cooling duration.' }
      - name: Runtime automation tests
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj --configuration Release --no-restore --verbosity normal -p:EnableWindowsTargeting=true
      - name: Validate Monitor Only hard cutover invariants
        shell: pwsh
        run: |
          $program = Get-Content src/GPTDeskTop/Program.cs -Raw
          $gate = Get-Content src/GPTDeskTop/UI/MonitorOnlyStartupGate.cs -Raw
          $ownership = Get-Content src/GPTDeskTop/Services/SimpleMonitorChromeOwnershipGate.cs -Raw
          $session = Get-Content src/GPTDeskTop/Services/SimpleMonitorProfileSession.cs -Raw
          if ($program -notmatch 'GPTDeskTop-MonitorOnly-SingleInstance') { throw 'Monitor Only application singleton is missing.' }
          if ($program -notmatch 'MonitorOnlyStartupGate\.Run\(database\)') { throw 'Program does not hard-cut over to Monitor Only.' }
          if ($program -match 'new MainForm\(') { throw 'Legacy Current GPTDeskTop MainForm is still constructed by Program.' }
          if ($program -match 'new ChatGptMonitorService\(') { throw 'Legacy saved-monitor runtime is still constructed by Program.' }
          if ($program -match 'new DevelopmentTaskRuntimeBinding\(') { throw 'Legacy development runtime is still constructed by Program.' }
          if ($program -match 'new TrayNotificationService\(') { throw 'Legacy tray runtime is still constructed by Program.' }
          if ($gate -notmatch 'new SimpleMonitorForm\(database\)') { throw 'Monitor Only form is not the interactive startup surface.' }
          if ($gate -notmatch 'Application\.Run\(form\)') { throw 'Monitor Only form does not own the application message loop.' }
          if ($ownership -notmatch 'Kill\(entireProcessTree: true\)') { throw 'Stale GPTDeskTop-owned Chrome process-tree reconciliation is missing.' }
          if ($ownership -notmatch 'Ordinary Chrome is untouched') { throw 'Ordinary Chrome protection contract is missing.' }
          if ($ownership -notmatch '--user-data-dir=') { throw 'Managed Chrome ownership is not scoped by user-data-dir.' }
          if ($session -notmatch 'allowBrowserMutationRecovery: false') { throw 'Monitor Only CDP runtime is not configured fail-passive.' }
          if ($session -notmatch 'Runtime recovery is passive') { throw 'Passive same-session recovery contract is missing.' }
          if ($session -notmatch 'The only legal Process.Start opportunity') { throw 'Single explicit Start Monitor launch boundary is missing.' }
      - name: Validate one-message-per-work-window lifecycle
        shell: pwsh
        run: |
          $engine = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskEngine.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskWorkWindowTests.cs -Raw
          $cycle = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskCoolingCycleTests.cs -Raw
          if ($engine -notmatch '_messageDeliveredThisWindow') { throw 'Work-window message delivery guard is missing.' }
          if ($tests -notmatch 'SuccessfulMessageDoesNotEmitSecondMessageWithinSameWorkWindow') { throw 'One-message-per-window regression test is missing.' }
          if ($tests -notmatch 'PersistedDeliveredPreviousMessagePreventsDuplicateAfterResume') { throw 'Restart duplicate-prevention test is missing.' }
          if ($cycle -notmatch 'CoolingCompletesAndNextWorkWindowEmitsExactlyOneNextMessage') { throw 'Work/cooling integration test is missing.' }
          if ($cycle -notmatch 'CoolingStateCannotAuthorizeDelivery') { throw 'Cooling delivery guard regression test is missing.' }
      - name: Validate development lifecycle components remain intact and decommissioned from startup
        shell: pwsh
        run: |
          $engine = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskEngine.cs -Raw
          $control = Get-Content src/GPTDeskTop/UI/DevelopmentTaskDashboardControl.cs -Raw
          $binding = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskRuntimeBinding.cs -Raw
          $program = Get-Content src/GPTDeskTop/Program.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskPauseTests.cs -Raw
          $bindingTests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskRuntimeBindingTests.cs -Raw
          if ($engine -notmatch 'Task PauseAsync') { throw 'Development plan pause lifecycle is missing.' }
          if ($engine -notmatch 'DevelopmentTaskEngineStatus.Paused') { throw 'Paused state is missing.' }
          if ($control -notmatch 'DevelopmentTaskRuntimeBinding') { throw 'Dashboard component lost its runtime binding contract.' }
          if ($control -notmatch 'Start') { throw 'Development dashboard Start control is missing.' }
          if ($control -notmatch 'Pause') { throw 'Development dashboard Pause control is missing.' }
          if ($control -notmatch 'Resume') { throw 'Development dashboard Resume control is missing.' }
          if ($control -notmatch 'Stop') { throw 'Development dashboard Stop control is missing.' }
          if ($control -notmatch 'Cooling — no delivery') { throw 'Cooling no-delivery status is missing.' }
          if ($binding -notmatch 'PauseAsync') { throw 'Runtime binding pause control is missing.' }
          if ($binding -notmatch 'ResumeAsync') { throw 'Runtime binding resume control is missing.' }
          if ($binding -notmatch 'DevelopmentTaskDynamicDeliveryCoordinator') { throw 'Runtime binding is not connected to dynamic delivery.' }
          if ($program -notmatch 'MonitorOnlyStartupGate\.Run\(database\)') { throw 'Monitor Only startup gate is missing.' }
          if ($program -match 'DevelopmentTaskRuntimeBinding') { throw 'Development runtime must remain decommissioned from Program startup.' }
          if ($program -match 'DevelopmentTaskMonitorTargetFactory') { throw 'Saved-monitor target factory must remain decommissioned from Program startup.' }
          if ($program -match 'DevelopmentTaskDashboardControl') { throw 'Development dashboard must remain decommissioned from Program startup.' }
          if ($tests -notmatch 'PauseStopsDeliveryWorkerAndResumeRestartsIt') { throw 'Pause/resume component regression test is missing.' }
          if ($bindingTests -notmatch 'BindingExposesEngineAndFullLifecycleControls') { throw 'Runtime binding lifecycle component test is missing.' }
      - name: Validate development lifecycle integration
        shell: pwsh
        run: |
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskLifecycleIntegrationTests.cs -Raw
          if ($tests -notmatch 'TwoMonitorsBothVerified_AllowsAdvance') { throw 'Two-monitor success integration test is missing.' }
          if ($tests -notmatch 'OneMonitorFails_OtherReceiptRemainsReusableOnRetry') { throw 'Partial monitor failure integration test is missing.' }
          if ($tests -notmatch 'ReboundTabRequiresSameConversationUrl') { throw 'Tab replacement integration test is missing.' }
          if ($tests -notmatch 'WorkingRecoveryKeepsCurrentMessageCheckpoint') { throw 'Working restart test is missing.' }
          if ($tests -notmatch 'CoolingRecoveryDoesNotAuthorizeDelivery') { throw 'Cooling delivery guard test is missing.' }
      - name: Validate development task delivery invariants
        shell: pwsh
        run: |
          $engine = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskEngine.cs -Raw
          $coordinator = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskDeliveryCoordinator.cs -Raw
          $bridge = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/MonitorDevelopmentTaskBridge.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskDeliveryCoordinatorTests.cs -Raw
          if ($engine -notmatch 'MessageReady') { throw 'Development task message emission is missing.' }
          if ($engine -notmatch '_lastEmittedMessageIndex') { throw 'Duplicate task-message guard is missing.' }
          if ($coordinator -notmatch '_verifiedSender') { throw 'Verified delivery callback is missing.' }
          if ($coordinator -notmatch 'if \(!sent\)') { throw 'Task advancement is not gated on verified send success.' }
          if ($coordinator -notmatch 'await _engine\.AdvanceAsync\(\)') { throw 'Successful delivery does not advance the task.' }
          if ($bridge -notmatch 'IsMonitorRunning') { throw 'Development task bridge is not bound to the active Monitor.' }
          if ($bridge -notmatch 'SendChatMessageVerifiedAsync') { throw 'Development task bridge is not using verified CDP delivery.' }
          if ($tests -notmatch 'FailedDeliveryDoesNotAdvanceTask') { throw 'Failed-delivery regression test is missing.' }
          if ($tests -notmatch 'SuccessfulDeliveryAdvancesExactlyOnce') { throw 'Successful-delivery regression test is missing.' }
      - name: Validate multi-monitor development delivery
        shell: pwsh
        run: |
          $state = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskState.cs -Raw
          $coordinator = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskMultiMonitorDeliveryCoordinator.cs -Raw
          $dynamic = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskDynamicDeliveryCoordinator.cs -Raw
          $binding = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskRuntimeBinding.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/DevelopmentTaskMultiMonitorDeliveryTests.cs -Raw
          if ($state -notmatch 'DeliveryReceipts') { throw 'Per-monitor development delivery receipts are missing.' }
          if ($state -notmatch 'DevelopmentTaskDeliveryReceipt') { throw 'Development delivery receipt model is missing.' }
          if ($coordinator -notmatch 'Action<string>') { throw 'Multi-monitor delivery event type is invalid.' }
          if ($coordinator -notmatch 'allDelivered') { throw 'All-recipient delivery gate is missing.' }
          if ($coordinator -notmatch 'await _engine\.AdvanceAsync\(\)') { throw 'Multi-monitor delivery does not advance only after all recipients.' }
          if ($dynamic -notmatch 'Action<string>') { throw 'Dynamic delivery event type is invalid.' }
          if ($dynamic -notmatch 'ResolveEnabledRecipientsAsync') { throw 'Dynamic recipient resolution is missing.' }
          if ($dynamic -notmatch 'DevelopmentTaskMultiMonitorDeliveryCoordinator') { throw 'Dynamic delivery is not using the multi-monitor coordinator.' }
          if ($binding -notmatch 'DevelopmentTaskDynamicDeliveryCoordinator') { throw 'Runtime binding is not attached to dynamic delivery.' }
          if ($tests -notmatch 'PartialDeliveryKeepsSuccessfulRecipientReceiptForRetry') { throw 'Partial multi-monitor receipt test is missing.' }
          if ($tests -notmatch 'DifferentTabInvalidatesPreviousReceiptForSameMonitor') { throw 'Tab-change receipt invalidation test is missing.' }
      - name: Validate saved monitor chat rebinding
        shell: pwsh
        run: |
          $resolver = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/SavedMonitorTabResolver.cs -Raw
          $factory = Get-Content src/GPTDeskTop/Services/DevelopmentTaskEngine/DevelopmentTaskMonitorTargetFactory.cs -Raw
          $tests = Get-Content tests/GPTDeskTop.RuntimeTests/SavedMonitorTabResolverTests.cs -Raw
          if ($resolver -notmatch 'PersistedTabId') { throw 'Exact persisted Chrome target binding is missing.' }
          if ($resolver -notmatch 'PersistedConversationUrl') { throw 'Conversation URL rebinding fallback is missing.' }
          if ($factory -notmatch 'ResolveEnabledRecipientsAsync') { throw 'Saved monitor recipient factory is missing.' }
          if ($factory -notmatch 'DevelopmentMonitorRebound') { throw 'Monitor rebind event logging is missing.' }
          if ($factory -notmatch 'DevelopmentMonitorTabUnavailable') { throw 'Missing-chat state is not logged.' }
          if ($factory -notmatch 'DevelopmentMonitorTargetIdUpdated') { throw 'Rebound Chrome target ID persistence is missing.' }
          if ($tests -notmatch 'ExactPersistedTabIdWins') { throw 'Exact-tab rebinding test is missing.' }
          if ($tests -notmatch 'RecreatedChromeTargetCanBeRecoveredByConversationUrl') { throw 'Restart URL rebinding test is missing.' }
          if ($tests -notmatch 'MissingConversationDoesNotFallBackToTitle') { throw 'Unsafe title fallback regression test is missing.' }
      - name: Validate CDP delivery reliability invariants
        shell: pwsh
        run: |
          $chrome = Get-Content src/GPTDeskTop/Services/ChromeDevToolsService.cs -Raw
          $monitor = Get-Content src/GPTDeskTop/Services/ChatGptMonitorService.cs -Raw
          if ($chrome -notmatch 'Promise was collected') { throw 'Transient Promise-collected retry handling is missing.' }
          if ($chrome -notmatch 'attempt <= 3') { throw 'Runtime.evaluate retry bound is missing.' }
          if ($chrome -notmatch 'GetUserMessageSnapshotAsync') { throw 'Verified-send snapshot guard is missing.' }
          if ($chrome -notmatch 'current\.Count > before\.Count') { throw 'Verified-send pre-send duplicate guard is missing.' }
          if ($chrome -notmatch 'after\.Count > before\.Count') { throw 'Verified-send post-send receipt check is missing.' }
          if ($monitor -notmatch 'SendChatMessageVerifiedAsync') { throw 'Monitor worker component is not using verified delivery.' }
      - name: Validate legacy crash recovery remains isolated from Monitor Only
        shell: pwsh
        run: |
          $recovery = Get-Content src/GPTDeskTop/Services/CrashRecoveryService.cs -Raw
          $state = Get-Content src/GPTDeskTop/Services/CrashRecoveryStateService.cs -Raw
          $policy = Get-Content src/GPTDeskTop/Services/CrashRecoveryOutcomePolicy.cs -Raw
          $program = Get-Content src/GPTDeskTop/Program.cs -Raw
          $session = Get-Content src/GPTDeskTop/Services/SimpleMonitorProfileSession.cs -Raw
          if ($recovery -notmatch 'CrashRecoveryPending') { throw 'Legacy crash recovery pending marker is missing.' }
          if ($recovery -notmatch 'CloseAllMonitorTabsAsync') { throw 'Legacy recovery stale-browser cleanup is missing.' }
          if ($recovery -notmatch 'SendChatMessageVerifiedAsync') { throw 'Legacy recovery message is not verified before success.' }
          if ($recovery -notmatch 'CrashRecoverySendFailed') { throw 'Legacy recovery send failure is not logged.' }
          if ($recovery -notmatch 'SetSettingAsync\("CrashRecoveryPending",\s*"0"') { throw 'Legacy recovery success does not clear its pending marker.' }
          if ($state -notmatch 'SetSettingAsync\("CrashRecoveryPending",\s*"1"') { throw 'Legacy recovery state cannot persist its pending marker.' }
          if ($state -notmatch 'CrashRecovery\.RecoveryId') { throw 'Legacy recovery incident identity is missing.' }
          if ($recovery -notmatch 'CrashRecoveryAlreadyVerified') { throw 'Legacy already-recovered monitor path is missing.' }
          if ($policy -notmatch 'outcomes\.All\(x => x == CrashRecoveryOutcome\.Success\)') { throw 'Legacy pending-clear all-success policy is missing.' }
          if ($program -match 'CrashRecoveryService\.RecoverIfPendingAsync') { throw 'Legacy crash recovery must not run from Monitor Only startup.' }
          if ($session -notmatch 'allowBrowserMutationRecovery: false') { throw 'Monitor Only browser mutation recovery must remain disabled.' }
          if ($session -notmatch 'Runtime recovery is passive') { throw 'Monitor Only passive runtime recovery contract is missing.' }
      - name: Build application
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj --configuration Release --no-restore
      - name: Build setup
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj --configuration Release --no-restore
      - name: Build helper
        run: dotnet build src/GPTDeskTop.Build/GPTDeskTop.Build.csproj --configuration Release --no-restore
      - name: Validate rotation safety invariants
        shell: pwsh
        run: |
          $file = Get-Content src/GPTDeskTop/Services/ChatGptMonitorService.cs -Raw
          if ($file -notmatch 'ConversationHandoffService') { throw 'Conversation handoff integration is missing.' }
          if ($file -notmatch 'CreateNewChatTabAsync') { throw 'Conversation rotation is missing.' }
          if ($file -notmatch 'if \(!sent\)') { throw 'New-chat send result is not validated.' }
          if ($file -notmatch 'CloseTabAsync\(oldTab') { throw 'Old chat is not closed after successful rotation.' }
