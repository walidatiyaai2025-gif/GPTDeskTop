name: V2035 Monitor Pacing Patch

on:
  push:
    branches:
      - fix/v2035-monitor-pacing
    paths:
      - .github/workflows/v2035-pacing-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2035-monitor-pacing
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply corrected pacing patch
        shell: pwsh
        run: python tools/v2035_patch_v2.py

      - name: Runtime regression tests
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --nologo

      - name: Build application
        shell: pwsh
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release --nologo

      - name: Commit validated source and tests only
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git add src/GPTDeskTop/Services/SimpleMonitorSafetyGate.cs
          git add src/GPTDeskTop/Services/SimpleMonitorRunner.cs
          git add src/GPTDeskTop/UI/SimpleMonitorForm.cs
          git add tests/GPTDeskTop.RuntimeTests/SimpleMonitorRateLimitOverlayRegressionTests.cs
          git add tests/GPTDeskTop.RuntimeTests/SimpleMonitorModeRegressionTests.cs
          git add tests/GPTDeskTop.RuntimeTests/MonitorOnlyVisualHotfixRegressionTests.cs
          git add tests/GPTDeskTop.RuntimeTests/SimpleMonitorPacingRegressionTests.cs
          git diff --cached --check
          git commit -m "fix: pace Monitor Only sends to reduce rate limiting"
          git push origin HEAD:fix/v2035-monitor-pacing
