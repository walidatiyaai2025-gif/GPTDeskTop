name: Release Artifact

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GPTDeskTop.sln

      - name: Build Release x64
        run: dotnet build GPTDeskTop.sln --configuration Release --no-restore -p:Platform=x64

      - name: Verify setup executable
        shell: pwsh
        run: |
          $setup = 'Output/Setup/GPTDeskTop-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'GPTDeskTop-Setup.exe was not produced.' }
          if ((Get-Item $setup).Length -le 0) { throw 'GPTDeskTop-Setup.exe is empty.' }

      - name: Smoke-test embedded installer payload
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'Output/Setup/GPTDeskTop-Setup.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '--verify-payload' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "GPTDeskTop-Setup.exe failed embedded payload verification with exit code $($process.ExitCode)."
          }

      - name: Package release and generate SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Dist | Out-Null
          Copy-Item 'Output/Setup/GPTDeskTop-Setup.exe' 'Dist/GPTDeskTop-Setup.exe' -Force
          Compress-Archive -Path 'Output/Setup/*' -DestinationPath 'Dist/GPTDeskTop-Windows-x64.zip' -Force

          $exeHash = (Get-FileHash 'Dist/GPTDeskTop-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash 'Dist/GPTDeskTop-Windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  GPTDeskTop-Setup.exe"
            "$zipHash  GPTDeskTop-Windows-x64.zip"
          ) | Set-Content -Path 'Dist/SHA256SUMS.txt' -Encoding ascii

          if ((Get-Item 'Dist/GPTDeskTop-Windows-x64.zip').Length -le 0) { throw 'Release ZIP is empty.' }
          if ((Get-Item 'Dist/SHA256SUMS.txt').Length -le 0) { throw 'SHA256SUMS.txt is empty.' }

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-Release
          path: Dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.0.0-build.${{ github.run_number }}"
          $title = "GPTDeskTop v2.0.0 build ${{ github.run_number }}"
          $notes = @"
          Automated verified Windows x64 release from `main`.

          Commit: ${{ github.sha }}
          Workflow run: ${{ github.run_id }}

          The setup executable passed an embedded-payload smoke test before publication.
          Required assets are attached below. Verify downloads with SHA256SUMS.txt.
          "@

          gh release create $tag `
            'Dist/GPTDeskTop-Setup.exe' `
            'Dist/GPTDeskTop-Windows-x64.zip' `
            'Dist/SHA256SUMS.txt' `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title $title `
            --notes $notes `
            --latest

      - name: Verify published GitHub Release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.0.0-build.${{ github.run_number }}"
          $assets = gh release view $tag --repo '${{ github.repository }}' --json assets --jq '.assets[].name'
          $required = @('GPTDeskTop-Setup.exe', 'GPTDeskTop-Windows-x64.zip', 'SHA256SUMS.txt')
          foreach ($name in $required) {
            if ($assets -notcontains $name) { throw "Published GitHub Release is missing required asset: $name" }
          }
