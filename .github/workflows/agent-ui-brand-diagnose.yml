name: Agent UI Brand Diagnose
on:
  push:
    branches: [ agent/icon-newchat-wide-monitors ]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/icon-newchat-wide-monitors
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Capture runtime test failure as annotation
        shell: pwsh
        run: |
          dotnet restore tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -p:EnableWindowsTargeting=true | Out-Null
          $lines = & dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release -p:EnableWindowsTargeting=true --no-restore 2>&1 | ForEach-Object { $_.ToString() }
          $text = ($lines -join "`n")
          $failureLines = $lines | Where-Object { $_ -match 'error CS|Failed |Error Message|Assert\.|Expected|Actual|Build FAILED|error MSB' }
          if ($failureLines.Count -eq 0) { $failureLines = $lines | Select-Object -Last 60 }
          $message = (($failureLines | Select-Object -First 40) -join ' | ')
          if ([string]::IsNullOrWhiteSpace($message)) { $message = $text.Substring(0, [Math]::Min(3500, $text.Length)) }
          $message = $message.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          if ($message.Length -gt 7000) { $message = $message.Substring(0,7000) }
          Write-Host "::error title=UI-BRAND runtime-test diagnostic::$message"
          exit 0
