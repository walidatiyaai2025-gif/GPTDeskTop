name: Apply Issue 69 Patch

on:
  push:
    branches:
      - fix/transactional-conversation-handoff
    paths:
      - .github/workflows/issue-69-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply focused patch
        shell: pwsh
        run: python eng/apply-issue-69.py

      - name: Remove temporary patch infrastructure
        shell: pwsh
        run: |
          Remove-Item eng/apply-issue-69.py -Force
          Remove-Item .github/workflows/issue-69-apply.yml -Force

      - name: Validate runtime tests
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --verbosity minimal

      - name: Commit validated implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw "No validated implementation changes were produced." }
          git commit -m "fix: make conversation handoff transactional"
          git push origin HEAD:fix/transactional-conversation-handoff
