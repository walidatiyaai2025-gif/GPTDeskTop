name: Agent verified recovery send patch

on:
  push:
    branches:
      - agent/recover-missing-monitor-tabs-shutdown-loading
    paths:
      - .github/workflows/agent-verified-recovery-send-patch.yml

permissions:
  contents: write

jobs:
  patch-verified-send:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-missing-monitor-tabs-shutdown-loading
          fetch-depth: 0
      - name: Patch verified recovery send
        shell: pwsh
        run: ./.github/scripts/patch-verified-recovery-send.ps1
