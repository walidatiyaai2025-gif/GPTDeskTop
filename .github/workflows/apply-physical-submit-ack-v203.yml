name: Apply Physical Submit Ack v2.0.3

on:
  push:
    branches:
      - worker/gptdesktop-final-runtime-closure

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout canonical runtime branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: worker/gptdesktop-final-runtime-closure

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply v2.0.3 physical submit acknowledgement closure
        shell: pwsh
        run: python tools/apply_physical_submit_ack_v203.py

      - name: Restore
        shell: pwsh
        run: dotnet restore GPTDeskTop.sln

      - name: Focused physical submit regressions
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --filter "FullyQualifiedName~PhysicalSubmitAcceptanceRegressionTests|FullyQualifiedName~VerifiedSendTransportRecoveryRegressionTests|FullyQualifiedName~OutboundDeliveryWallClockAcceptanceTests" --logger "trx;LogFileName=physical-submit-v203.trx"

      - name: Full runtime suite
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --logger "trx;LogFileName=runtime-full-v203.trx"

      - name: Remove one-shot staging files
        shell: pwsh
        run: |
          git rm -f tools/apply_physical_submit_ack_v203.py
          git rm -f .github/workflows/apply-physical-submit-ack-v203.yml
          if (Test-Path dummy) { git rm -f dummy }

      - name: Commit final source tree
        shell: pwsh
        run: |
          git config user.name "gptdesktop-runtime-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): require observable acceptance after physical send click"
          git push origin HEAD:worker/gptdesktop-final-runtime-closure
