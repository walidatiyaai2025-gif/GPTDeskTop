name: Agent UI v2 patch

on:
  push:
    branches:
      - agent/ui-live-monitor-recovery-v2
    paths:
      - .agent/apply_ui_v2_patch.py
      - .github/workflows/agent-ui-v2-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: bootstrap v2 patch workflow' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-live-monitor-recovery-v2
          fetch-depth: 0

      - name: Apply asserted patch
        run: python3 .agent/apply_ui_v2_patch.py

      - name: Validate diff
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ship dashboard-first monitoring and recovery v2"
          git push origin HEAD:agent/ui-live-monitor-recovery-v2
