name: GPTDeskTop v2.0.13 Physical Submit Recovery

on:
  push:
    branches:
      - hotfix/v213-physical-submit-retry

permissions:
  contents: write

jobs:
  patch-validate-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: hotfix/v213-physical-submit-retry
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply v2.0.13 physical submit recovery patch
        id: patch
        shell: pwsh
        run: |
          if (Test-Path 'tools/apply_v213_physical_submit_retry.py') {
            python tools/apply_v213_physical_submit_retry.py
            git config user.name "gptdesktop-runtime-worker"
            git config user.email "actions@users.noreply.github.com"
            git rm tools/apply_v213_physical_submit_retry.py
            git add src tests
            git diff --check
            git commit -m "fix(runtime): recover definitely unsent fresh-chat submits"
            git push origin HEAD:hotfix/v213-physical-submit-retry
            "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Defer validation to exact committed source
        if: steps.patch.outputs.changed == 'true'
        shell: pwsh
        run: Write-Host 'v2.0.13 source committed. Push-triggered exact-head run will validate and package.'

      - name: Setup .NET 8
        if: steps.patch.outputs.changed == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet restore GPTDeskTop.sln

      - name: Focused physical submit regressions
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --filter "FullyQualifiedName~FreshChatPhysicalSubmitFallbackRegressionTests|FullyQualifiedName~PhysicalSubmitAcceptanceRegressionTests|FullyQualifiedName~RenderedUserTurnReceiptRegressionTests|FullyQualifiedName~VerifiedSendTransportRecoveryRegressionTests|FullyQualifiedName~FreshChatPerResponseRegressionTests|FullyQualifiedName~FreshChatGenerationLeaseHandoffRegressionTests|FullyQualifiedName~FreshChatTransportAnchorRegressionTests" --logger "trx;LogFileName=v213-physical-submit.trx"

      - name: Full runtime and product suite
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --logger "trx;LogFileName=v213-full-runtime.trx"

      - name: Release x64 build
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release -r win-x64

      - name: Build final Setup EXE
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj -c Release -p:RunPackagingTargets=true

      - name: Verify exact head and package final source
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor 9c726aa5b69c8904768f9ca19b12b247373b6ea8 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.13 lost v2.0.12 ancestry.' }
          if (Test-Path 'tools/apply_v213_physical_submit_retry.py') { throw 'One-shot patch applicator leaked into final source.' }
          $chrome = Get-Content 'src/GPTDeskTop/Services/ChromeDevToolsService.cs' -Raw
          $monitor = Get-Content 'src/GPTDeskTop/Services/ChatGptMonitorService.cs' -Raw
          $readiness = Get-Content 'src/GPTDeskTop/Services/ChatComposerReadinessScript.cs' -Raw
          $app = Get-Content 'src/GPTDeskTop/GPTDeskTop.csproj' -Raw
          $setup = Get-Content 'src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj' -Raw
          $setupProgram = Get-Content 'src/GPTDeskTop.Setup/Program.cs' -Raw
          if (!$chrome.Contains('NativeEnterSubmitDispatched')) { throw 'Native Enter submit fallback missing.' }
          if (!$chrome.Contains('confirmed-unsent-composer')) { throw 'Definitely-unsent composer classifier missing.' }
          if (!$monitor.Contains('IsComposerDefinitelyStillAwaitingSubmitAsync')) { throw 'Monitor retry classification bridge missing.' }
          if ($readiness.Contains('document.querySelector(''button[data-testid="send-button"]'') ||')) { throw 'Stale send-button selector remains.' }
          if (!$app.Contains('<Version>2.0.13</Version>')) { throw 'App version mismatch.' }
          if (!$setup.Contains('<Version>2.0.13</Version>')) { throw 'Setup version mismatch.' }
          if (!$setupProgram.Contains('Version = "2.0.13"')) { throw 'Setup program version mismatch.' }
          $exe = 'Output/Setup/GPTDeskTop-Setup.exe'
          if (!(Test-Path $exe)) { throw 'Setup EXE missing.' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Setup EXE is not PE/MZ.' }
          $setupSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $exe).Length
          git archive --format=zip --output GPTDeskTop-v2.0.13-FINAL-SOURCE.zip HEAD
          $sourceSha = (Get-FileHash GPTDeskTop-v2.0.13-FINAL-SOURCE.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "FINAL_HEAD=$head`nBASE_V212_HEAD=9c726aa5b69c8904768f9ca19b12b247373b6ea8`nVERSION=2.0.13`nBEHAVIOR=NATIVE_ENTER_FALLBACK_AND_DEFINITELY_UNSENT_RETRY`nSETUP_SHA256=$setupSha`nSETUP_SIZE=$setupSize`nSOURCE_ZIP_SHA256=$sourceSha" | Set-Content FINAL-V213-IDENTITY.txt
          Write-Host "FINAL_HEAD=$head"
          Write-Host "SETUP_SHA256=$setupSha"
          Write-Host "SOURCE_ZIP_SHA256=$sourceSha"

      - name: Upload v2.0.13 final source
        if: steps.patch.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.13-FINAL-SOURCE
          path: |
            GPTDeskTop-v2.0.13-FINAL-SOURCE.zip
            FINAL-V213-IDENTITY.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload v2.0.13 final setup
        if: steps.patch.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.13-FINAL-SETUP
          path: |
            Output/Setup/GPTDeskTop-Setup.exe
            Output/Setup/Version.txt
            FINAL-V213-IDENTITY.txt
          if-no-files-found: error
          retention-days: 30
