name: Reconcile Issue 83 Status

on:
  push:
    branches:
      - fix/block-import-while-monitors-running
    paths:
      - .github/workflows/issue-83-status.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Reconcile development status
        shell: pwsh
        run: python eng/reconcile-issue-83-status.py
      - name: Remove temporary reconciliation infrastructure
        shell: pwsh
        run: |
          Remove-Item eng/reconcile-issue-83-status.py -Force
          Remove-Item .github/workflows/issue-83-status.yml -Force
      - name: Validate runtime tests
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --verbosity minimal
      - name: Commit reconciled status
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw "No reconciled status changes were produced." }
          git commit -m "docs: reconcile issue 83 validation status"
          git push origin HEAD:fix/block-import-while-monitors-running
