name: QA Passive Chat Wait

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  watchdog:
    name: Wait on slow chat and recover explicit error
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application
        run: dotnet restore src/GPTDeskTop/GPTDeskTop.csproj

      - name: Build application
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release --no-restore

      - name: Verify passive long-response wait and fresh-chat error recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'src/GPTDeskTop/bin/Release/net8.0-windows/GPTDeskTop.exe').Path
          $workingDirectory = Split-Path $exe -Parent
          $root = Join-Path $env:RUNNER_TEMP "gptdesktop-passive-wait-$env:GITHUB_RUN_ID"
          $resultPath = Join-Path $root 'result.json'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $probe = Start-Process -FilePath $exe -WorkingDirectory $workingDirectory -ArgumentList @('--qa-no-response-probe', $resultPath) -PassThru
          $deadline = (Get-Date).AddSeconds(150)
          while (-not $probe.HasExited) {
            if ((Get-Date) -ge $deadline) {
              Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
              throw 'Passive chat-wait probe exceeded its 150-second workflow deadline.'
            }
            Start-Sleep -Seconds 1
            $probe.Refresh()
          }

          if ($probe.ExitCode -ne 0) {
            $errorPath = "$resultPath.error.txt"
            if (Test-Path $errorPath) { Get-Content $errorPath | Write-Host }
            throw "Passive chat-wait probe failed. ExitCode=$($probe.ExitCode)"
          }
          if (-not (Test-Path $resultPath)) { throw 'Passive chat-wait probe did not create result.json.' }

          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $activity = @($result.Activity | ForEach-Object { [string]$_ })
          $recoveryStartCount = @($activity | Where-Object { $_ -like '*ChatGPT error saved. Opening a fresh chat and continuing under the same Monitor ID*' }).Count
          $recoveryCompletedCount = @($activity | Where-Object { $_ -like '*ChatGPT error recovery complete. New conversation is monitored as Monitor #*' }).Count
          $verifiedContinuationCount = @($activity | Where-Object { $_ -like '*Verified message accepted. Exactly-once guard closed the delivery operation*' -or $_ -like '*Verified message accepted on attempt*' }).Count

          $failed = $false
          if ($result.SlowText -ne 'slow-complete-load-1') { Write-Host "ASSERTION: Slow/generating tab was unexpectedly reloaded or did not complete, final text='$($result.SlowText)'."; $failed = $true }
          if ($result.RecoveryText -ne 'recovery-received:qa-error-continuation') { Write-Host "ASSERTION: Fresh recovery chat did not receive the configured continuation message, final text='$($result.RecoveryText)'."; $failed = $true }
          if ([long]$result.ReboundErrorMonitorId -ne [long]$result.ErrorMonitorId) { Write-Host "ASSERTION: Recovery changed Monitor ID. original=$($result.ErrorMonitorId) rebound=$($result.ReboundErrorMonitorId)."; $failed = $true }
          if ($result.ReboundErrorMonitorUrl -ne 'https://chatgpt.com/c/qa-passive-wait-recovery') { Write-Host "ASSERTION: Saved monitor was not rebound to the fresh conversation URL: '$($result.ReboundErrorMonitorUrl)'."; $failed = $true }
          if ([string]::IsNullOrWhiteSpace([string]$result.RecoveryTabId) -or $result.ReboundErrorMonitorTabId -ne $result.RecoveryTabId) { Write-Host "ASSERTION: Saved monitor target does not match the verified fresh recovery tab. saved='$($result.ReboundErrorMonitorTabId)' recovery='$($result.RecoveryTabId)'."; $failed = $true }
          if ([int]$result.SlowFalseRecoveryActivityCount -ne 0) { Write-Host "ASSERTION: Historical error text on the slow tab caused a false recovery; count=$($result.SlowFalseRecoveryActivityCount)."; $failed = $true }
          if ($recoveryStartCount -ne 1) { Write-Host "ASSERTION: Expected exactly one explicit-error fresh-chat recovery start in activity trace, got $recoveryStartCount."; $failed = $true }
          if ($recoveryCompletedCount -ne 1) { Write-Host "ASSERTION: Expected exactly one committed explicit-error recovery in activity trace, got $recoveryCompletedCount."; $failed = $true }
          if ($verifiedContinuationCount -lt 1) { Write-Host 'ASSERTION: Continuation delivery was never verified in the fresh chat activity trace.'; $failed = $true }
          if ([int]$result.ElapsedTimeRefreshActivityCount -ne 0) { Write-Host "ASSERTION: Elapsed time still triggered refresh behavior; count=$($result.ElapsedTimeRefreshActivityCount)."; $failed = $true }
          if ($result.OldErrorTabStillOpen -eq $true) { Write-Host 'ASSERTION: Errored old tab remained open after the verified handoff committed.'; $failed = $true }
          if ($result.RecoveryTabOpen -ne $true) { Write-Host 'ASSERTION: Fresh recovery tab is not open after handoff.'; $failed = $true }
          if ($result.SlowStillRunning -ne $true -or $result.ErrorStillRunning -ne $true) { Write-Host "ASSERTION: One or both monitor workers stopped before verification. SlowStillRunning=$($result.SlowStillRunning) ErrorStillRunning=$($result.ErrorStillRunning)"; $failed = $true }

          if ($failed) {
            Write-Host '--- Passive probe activity trace ---'
            foreach ($line in $activity) { Write-Host $line }
            Write-Host '--- End passive probe activity trace ---'
            throw 'Passive chat-wait behavioral assertions failed. See activity trace above.'
          }

          Write-Host "Verified passive wait + fresh-chat recovery: slow=$($result.SlowText), recovery=$($result.RecoveryText), monitorId=$($result.ErrorMonitorId), newTab=$($result.RecoveryTabId), starts=$recoveryStartCount, completed=$recoveryCompletedCount, elapsedRefreshes=$($result.ElapsedTimeRefreshActivityCount)."
