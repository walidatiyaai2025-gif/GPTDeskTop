name: QA Passive Chat Wait

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  watchdog:
    name: Wait on slow chat and recover explicit error
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore application
        run: dotnet restore src/GPTDeskTop/GPTDeskTop.csproj

      - name: Build application
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release --no-restore

      - name: Verify passive long-response wait and explicit-error recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'src/GPTDeskTop/bin/Release/net8.0-windows/GPTDeskTop.exe').Path
          $workingDirectory = Split-Path $exe -Parent
          $root = Join-Path $env:RUNNER_TEMP "gptdesktop-passive-wait-$env:GITHUB_RUN_ID"
          $resultPath = Join-Path $root 'result.json'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $probe = Start-Process -FilePath $exe -WorkingDirectory $workingDirectory -ArgumentList @('--qa-no-response-probe', $resultPath) -PassThru
          $deadline = (Get-Date).AddSeconds(150)
          while (-not $probe.HasExited) {
            if ((Get-Date) -ge $deadline) {
              Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue
              throw 'Passive chat-wait probe exceeded its 150-second workflow deadline.'
            }
            Start-Sleep -Seconds 1
            $probe.Refresh()
          }

          if ($probe.ExitCode -ne 0) {
            $errorPath = "$resultPath.error.txt"
            if (Test-Path $errorPath) { Get-Content $errorPath | Write-Host }
            throw "Passive chat-wait probe failed. ExitCode=$($probe.ExitCode)"
          }
          if (-not (Test-Path $resultPath)) { throw 'Passive chat-wait probe did not create result.json.' }

          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          $failed = $false
          if ($result.SlowText -ne 'slow-complete-load-1') { Write-Error "Slow/generating tab was unexpectedly reloaded or did not complete, final text='$($result.SlowText)'."; $failed = $true }
          if ($result.ErrorText -ne 'error-recovered-load-2') { Write-Error "Explicit-error tab was not refreshed exactly once, final text='$($result.ErrorText)'."; $failed = $true }
          if ([int]$result.SlowErrorRefreshActivityCount -ne 0) { Write-Error "Historical error text caused a false refresh; count=$($result.SlowErrorRefreshActivityCount)."; $failed = $true }
          if ([int]$result.ErrorRefreshActivityCount -ne 1) { Write-Error "Expected exactly one explicit-error refresh, got $($result.ErrorRefreshActivityCount)."; $failed = $true }
          if ([int]$result.ElapsedTimeRefreshActivityCount -ne 0) { Write-Error "Elapsed time still triggered refresh behavior; count=$($result.ElapsedTimeRefreshActivityCount)."; $failed = $true }
          if ($result.SlowStillRunning -ne $true -or $result.ErrorStillRunning -ne $true) { Write-Error "One or both monitor workers stopped before verification. SlowStillRunning=$($result.SlowStillRunning) ErrorStillRunning=$($result.ErrorStillRunning)"; $failed = $true }

          if ($failed) {
            Write-Host '--- Passive probe activity trace ---'
            foreach ($line in @($result.Activity)) { Write-Host $line }
            Write-Host '--- End passive probe activity trace ---'
            throw 'Passive chat-wait behavioral assertions failed. See activity trace above.'
          }

          Write-Host "Verified passive wait: slow=$($result.SlowText), explicitError=$($result.ErrorText), errorRefreshes=$($result.ErrorRefreshActivityCount), elapsedRefreshes=$($result.ElapsedTimeRefreshActivityCount)."
