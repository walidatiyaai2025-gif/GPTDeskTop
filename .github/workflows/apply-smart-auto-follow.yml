name: Apply Smart Auto Follow

on:
  push:
    branches:
      - agent/smart-chat-auto-follow

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[autofollow-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply-smart-auto-follow.py

      - name: Commit product changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GPTDeskTop/Configuration/AppConfig.cs src/GPTDeskTop/appsettings.json src/GPTDeskTop/Services/ChromeDevToolsService.cs tests/GPTDeskTop.RuntimeTests/SmartChatAutoFollowTests.cs
          git rm .github/workflows/apply-smart-auto-follow.yml scripts/apply-smart-auto-follow.py
          git commit -m "AUTOFOLLOW: add smart long-response chat following [autofollow-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
