name: Strict 15s Wall-Clock Hotfix

on:
  push:
    branches:
      - fix/runtime-strict-15s-wallclock

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/runtime-strict-15s-wallclock

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply strict wall-clock send-gap guard
        shell: pwsh
        run: |
          $path = 'src/GPTDeskTop/Runtime/OutboundDeliveryCoordinator.cs'
          $source = Get-Content $path -Raw

          if ($source -notmatch '_usesSystemDelay') {
            $old = @'
    private readonly Func<TimeSpan, CancellationToken, Task> _delayAsync;
    private readonly TimeSpan _interSendGap;
'@
            $new = @'
    private readonly Func<TimeSpan, CancellationToken, Task> _delayAsync;
    private readonly TimeSpan _interSendGap;
    private readonly bool _usesSystemDelay;
'@
            if (-not $source.Contains($old)) { throw 'Coordinator field anchor not found.' }
            $source = $source.Replace($old, $new)

            $old = @'
        _delayAsync = delayAsync ?? Task.Delay;
        _interSendGap = interSendGap ?? DefaultInterSendGap;
'@
            $new = @'
        _usesSystemDelay = delayAsync is null;
        _delayAsync = delayAsync ?? Task.Delay;
        _interSendGap = interSendGap ?? DefaultInterSendGap;
'@
            if (-not $source.Contains($old)) { throw 'Coordinator constructor anchor not found.' }
            $source = $source.Replace($old, $new)

            $old = @'
                    await _delayAsync(_interSendGap, CancellationToken.None).ConfigureAwait(false);
'@
            $new = @'
                    await _delayAsync(_interSendGap, CancellationToken.None).ConfigureAwait(false);

                    // Task.Delay may wake a fraction of a millisecond early on Windows. The
                    // production authority must never release before the actual 15-second
                    // wall-clock deadline, so close any residual gap before the global lease
                    // can be granted to the next monitor. Injected test delays remain untouched.
                    if (_usesSystemDelay && nextSendUtc.HasValue)
                    {
                        while (DateTimeOffset.UtcNow < nextSendUtc.Value)
                        {
                            var remaining = nextSendUtc.Value - DateTimeOffset.UtcNow;
                            await Task.Delay(
                                    remaining + TimeSpan.FromMilliseconds(1),
                                    CancellationToken.None)
                                .ConfigureAwait(false);
                        }
                    }
'@
            if (-not $source.Contains($old)) { throw 'Coordinator cooldown anchor not found.' }
            $source = $source.Replace($old, $new)
            Set-Content $path $source -NoNewline
          }

          $testPath = 'tests/GPTDeskTop.RuntimeTests/StrictWallClockSendGapRegressionTests.cs'
          @'
          namespace GPTDeskTop.RuntimeTests;

          public sealed class StrictWallClockSendGapRegressionTests
          {
              [Fact]
              public void ProductionCooldownClosesAnyEarlyTimerWakeBeforeGlobalRelease()
              {
                  var source = File.ReadAllText(Path.GetFullPath(Path.Combine(
                      AppContext.BaseDirectory,
                      "..", "..", "..", "..", "..",
                      "src", "GPTDeskTop", "Runtime", "OutboundDeliveryCoordinator.cs")));

                  Assert.Contains("_usesSystemDelay = delayAsync is null", source, StringComparison.Ordinal);
                  Assert.Contains("while (DateTimeOffset.UtcNow < nextSendUtc.Value)", source, StringComparison.Ordinal);
                  Assert.Contains("remaining + TimeSpan.FromMilliseconds(1)", source, StringComparison.Ordinal);
                  Assert.Contains("DefaultInterSendGap = TimeSpan.FromSeconds(15)", source, StringComparison.Ordinal);
              }
          }
          '@ | Set-Content $testPath

      - name: Persist hotfix source
        shell: pwsh
        run: |
          git config user.name 'gptdesktop-strict-gap-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/GPTDeskTop/Runtime/OutboundDeliveryCoordinator.cs tests/GPTDeskTop.RuntimeTests/StrictWallClockSendGapRegressionTests.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(runtime): guarantee at least 15s real wall-clock send spacing'
            git push origin HEAD:fix/runtime-strict-15s-wallclock
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore GPTDeskTop.sln

      - name: Focused real wall-clock acceptance
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --filter "FullyQualifiedName~OutboundDeliveryWallClockAcceptanceTests|FullyQualifiedName~StrictWallClockSendGapRegressionTests"

      - name: Full runtime regression suite
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore

      - name: Build standalone v2.0.1 setup
        shell: pwsh
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj -c Release -p:RunPackagingTargets=true

      - name: Verify setup executable
        shell: pwsh
        run: |
          $setup = 'Output/Setup/GPTDeskTop-Setup.exe'
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          $item = Get-Item $setup
          Write-Host "Setup bytes: $($item.Length)"
          Write-Host "Setup file version: $($item.VersionInfo.FileVersion)"
          Get-FileHash $setup -Algorithm SHA256

      - name: Upload setup exe
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.1-Strict-15s-Setup
          path: Output/Setup/GPTDeskTop-Setup.exe
          if-no-files-found: error
          retention-days: 30
