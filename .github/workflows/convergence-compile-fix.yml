name: Convergence Compile Fix

on:
  push:
    branches:
      - convergence/gptdesktop-final-source-v203

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: convergence/gptdesktop-final-source-v203
          fetch-depth: 0
      - name: Repair merged recovery variable conflict
        shell: pwsh
        run: |
          $path = 'src/GPTDeskTop/Services/ChatGptMonitorService.cs'
          $text = Get-Content $path -Raw
          $old = @'
                        var recoveryMessage = await _database.GetSettingAsync("ChatGptErrorContinuationMessage", cancellationToken)
                            ?? "كمل من آخر نقطة مؤكدة واستمر بدون تكرار ما تم إنجازه.";
                        Activity?.Invoke(monitor.Id, $"{prefix} ChatGPT error saved. Opening a fresh chat and continuing under the same Monitor ID...");
                        var oldTab = tab;
                        var handoffService = new ConversationHandoffService(_database);
                        var recoveryMessage = await handoffService.BuildAsync(monitor, text, oldTab, fallbackRecoveryMessage, cancellationToken);
'@
          $new = @'
                        var fallbackRecoveryMessage = await _database.GetSettingAsync("ChatGptErrorContinuationMessage", cancellationToken)
                            ?? "كمل من آخر نقطة مؤكدة واستمر بدون تكرار ما تم إنجازه.";
                        Activity?.Invoke(monitor.Id, $"{prefix} ChatGPT error saved. Opening a fresh chat and continuing under the same Monitor ID...");
                        var oldTab = tab;
                        var handoffService = new ConversationHandoffService(_database);
                        var recoveryMessage = await handoffService.BuildAsync(monitor, text, oldTab, fallbackRecoveryMessage, cancellationToken);
'@
          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Set-Content -Path $path -Value $text -Encoding utf8NoBOM
            git config user.name "gptdesktop-convergence-worker"
            git config user.email "actions@users.noreply.github.com"
            git add $path
            git commit -m "fix(convergence): preserve fallback recovery message after branch composition"
            git push origin HEAD:convergence/gptdesktop-final-source-v203
          } elseif ($text.Contains('var fallbackRecoveryMessage = await _database.GetSettingAsync("ChatGptErrorContinuationMessage"')) {
            Write-Host 'Compile conflict already repaired.'
          } else {
            throw 'Expected recovery conflict pattern was not found.'
          }
