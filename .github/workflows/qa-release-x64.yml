name: QA Release x64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release-x64:
    name: Release | x64 solution build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore GPTDeskTop.sln

      - name: Validate Release x64 solution configuration
        shell: pwsh
        run: |
          $solution = Get-Content GPTDeskTop.sln -Raw
          if ($solution -notmatch 'Release\|x64 = Release\|x64') {
            throw 'GPTDeskTop.sln does not define Release|x64.'
          }

          $appId = '{2C7C0A2D-9D1A-4F6E-8A11-635D3534FCA7}'
          $setupId = '{9E40B81C-B809-453D-B72A-4C17D878DB12}'
          $projectIds = @(
            $appId,
            '{B0A2D2C9-2E1D-4A8E-99D3-184A3E357A21}',
            $setupId
          )

          foreach ($projectId in $projectIds) {
            $escaped = [regex]::Escape($projectId)
            if ($solution -notmatch "$escaped\.Release\|x64\.Build\.0 = Release\|Any CPU") {
              throw "Project $projectId is not included in the Release|x64 solution build."
            }
          }

          $setupBlockPattern = '(?s)GPTDeskTop\.Setup.*?ProjectSection\(ProjectDependencies\).*?' + [regex]::Escape($appId) + '\s*=\s*' + [regex]::Escape($appId) + '.*?EndProjectSection'
          if ($solution -notmatch $setupBlockPattern) {
            throw 'GPTDeskTop.Setup does not declare GPTDeskTop as a solution build dependency.'
          }

      - name: Build solution Release x64
        run: dotnet build GPTDeskTop.sln --configuration Release --no-restore -p:Platform=x64

      - name: Verify application compile output
        shell: pwsh
        run: |
          $path = 'src/GPTDeskTop/bin/Release/net8.0-windows/GPTDeskTop.dll'
          if (-not (Test-Path $path)) { throw "Release|x64 solution build did not produce $path." }
          Write-Host "Verified application compile output: $path"

      - name: Verify published application PE and process launchability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'Output/Publish/GPTDeskTop.exe').Path
          & ./scripts/Test-WindowsX64Pe.ps1 -Path $exe

          $workingDirectory = Split-Path $exe -Parent
          $root = Join-Path $env:RUNNER_TEMP "gptdesktop-release-x64-launch-$env:GITHUB_RUN_ID"
          $db = Join-Path $root 'launch.db'
          $resultPath = Join-Path $root 'launch.json'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          try {
            $probe = Start-Process -FilePath $exe -WorkingDirectory $workingDirectory -ArgumentList @('--qa-crash-probe-verify', $db, $resultPath) -PassThru -Wait
            if ($probe.ExitCode -ne 0) {
              $errorPath = "$resultPath.error.txt"
              if (Test-Path $errorPath) { Get-Content $errorPath | Write-Host }
              throw "Release|x64 published application failed process launch probe. ExitCode=$($probe.ExitCode)"
            }
            if (-not (Test-Path $resultPath)) { throw 'Release|x64 published application did not create a startup receipt.' }
            $receipt = Get-Content $resultPath -Raw | ConvertFrom-Json
            if ([int]$receipt.ProcessId -le 0) { throw 'Release|x64 published application returned an invalid startup receipt.' }
            Write-Host "Verified published GPTDeskTop.exe can be loaded by Windows and execute managed startup code (PID $($receipt.ProcessId))."
          }
          finally {
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify standalone setup output
        shell: pwsh
        run: |
          $path = 'Output/Setup/GPTDeskTop-Setup.exe'
          if (-not (Test-Path $path)) { throw "Release|x64 solution build did not produce standalone setup $path." }
          & ./scripts/Test-WindowsX64Pe.ps1 -Path $path
          $versionPath = 'Output/Setup/Version.txt'
          if (-not (Test-Path $versionPath)) { throw "Standalone setup version receipt is missing: $versionPath." }
          $version = Get-Content $versionPath -Raw
          $projectPath = 'src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj'
          [xml]$project = Get-Content $projectPath
          $expectedVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) { throw "$projectPath does not define a Version." }
          $expectedReceipt = [regex]::Escape("GPTDeskTop Setup v$expectedVersion")
          if ($version -notmatch $expectedReceipt) { throw "Unexpected setup version receipt. Expected v$expectedVersion, got: $version" }
          Write-Host "Verified standalone setup output: $path"
          Write-Host $version

      - name: Verify embedded setup payload
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'Output/Setup/GPTDeskTop-Setup.exe').Path
          $probe = Start-Process -FilePath $setup -ArgumentList '--verify-payload' -PassThru -Wait
          if ($probe.ExitCode -ne 0) { throw "Standalone setup rejected its embedded payload. ExitCode=$($probe.ExitCode)" }
          Write-Host 'Verified setup embedded payload includes a valid Windows x64 application image.'

      - name: Verify interactive setup wizard contract
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'Output/Setup/GPTDeskTop-Setup.exe').Path
          $probe = Start-Process -FilePath $setup -ArgumentList '--verify-wizard' -PassThru -Wait
          if ($probe.ExitCode -ne 0) { throw "Standalone setup does not expose the required interactive wizard. ExitCode=$($probe.ExitCode)" }
          Write-Host 'Verified setup EXE launches the required Welcome/Options/Install/Finish wizard in normal mode.'

      - name: Verify setup compile output
        shell: pwsh
        run: |
          $path = 'Output/Setup/Build/GPTDeskTop-Setup.dll'
          if (-not (Test-Path $path)) { throw "Release|x64 solution build did not produce $path." }
          Write-Host "Verified setup compile output: $path"

      - name: Verify helper compile output
        shell: pwsh
        run: |
          $path = 'src/GPTDeskTop.Build/bin/Release/net8.0-windows/GPTDeskTop.Build.dll'
          if (-not (Test-Path $path)) { throw "Release|x64 solution build did not produce $path." }
          Write-Host "Verified helper compile output: $path"
