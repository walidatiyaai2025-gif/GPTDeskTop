name: GPTDeskTop v2.0.6 CDP Stability

on:
  push:
    branches:
      - hotfix/v206-cdp-stability

permissions:
  contents: write

jobs:
  patch-validate-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: hotfix/v206-cdp-stability
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply one-shot v2.0.6 source hotfix
        id: patch
        shell: pwsh
        run: |
          if (Test-Path 'tools/apply_v206_cdp_stability.py') {
            python tools/apply_v206_cdp_stability.py
            $chrome = Get-Content 'src/GPTDeskTop/Services/ChromeDevToolsService.cs' -Raw
            $monitor = Get-Content 'src/GPTDeskTop/Services/ChatGptMonitorService.cs' -Raw
            $app = Get-Content 'src/GPTDeskTop/GPTDeskTop.csproj' -Raw
            if (!$chrome.Contains('EnsureStableConversationTransportAsync')) { throw 'Stable CDP binding primitive was not written.' }
            if (!$chrome.Contains('pre-submit-cdp-recovered-before-physical-input')) { throw 'Pre-submit recovery boundary was not written.' }
            if (!$monitor.Contains('Chrome/CDP transport disconnect retry')) { throw 'Monitor transport rebind path was not written.' }
            if (!$app.Contains('<Version>2.0.6</Version>')) { throw 'Application version is not 2.0.6 after patch.' }
            git config user.name "gptdesktop-runtime-worker"
            git config user.email "actions@users.noreply.github.com"
            git rm tools/apply_v206_cdp_stability.py
            git add src tests
            if (git status --porcelain) {
              git commit -m "fix(runtime): stabilize same-conversation CDP transport before submit"
              git push origin HEAD:hotfix/v206-cdp-stability
              "changed=true" >> $env:GITHUB_OUTPUT
            } else {
              "changed=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Defer validation to exact committed source
        if: steps.patch.outputs.changed == 'true'
        shell: pwsh
        run: Write-Host 'v2.0.6 source committed. Push-triggered exact-head run will validate and package.'

      - name: Setup .NET 8
        if: steps.patch.outputs.changed == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet restore GPTDeskTop.sln

      - name: Focused CDP field regression tests
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --filter "FullyQualifiedName~CdpTransportStabilityRegressionTests|FullyQualifiedName~PhysicalSubmitAcceptanceRegressionTests|FullyQualifiedName~VerifiedSendTransportRecoveryRegressionTests|FullyQualifiedName~VerifiedSendTaskCancellationSelfHealRegressionTests" --logger "trx;LogFileName=v206-cdp-field.trx"

      - name: Full runtime and product suite
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --logger "trx;LogFileName=v206-full-runtime.trx"

      - name: Release x64 build
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release -r win-x64

      - name: Build final Setup EXE
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj -c Release -p:RunPackagingTargets=true

      - name: Verify exact head and package final source
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor fa54458a5414130e2e64b98ab63dfc57fc3c7520 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.6 source lost v2.0.5 exact-head ancestry.' }
          if (Test-Path 'tools/apply_v206_cdp_stability.py') { throw 'One-shot patch applicator leaked into final source.' }
          $chrome = Get-Content 'src/GPTDeskTop/Services/ChromeDevToolsService.cs' -Raw
          $monitor = Get-Content 'src/GPTDeskTop/Services/ChatGptMonitorService.cs' -Raw
          $app = Get-Content 'src/GPTDeskTop/GPTDeskTop.csproj' -Raw
          if (!$app.Contains('<Version>2.0.6</Version>')) { throw 'Application version is not 2.0.6.' }
          if (!$chrome.Contains('EnsureStableConversationTransportAsync')) { throw 'Final source lacks stable CDP binding primitive.' }
          if (!$chrome.Contains('cdp-transport-not-stable-before-physical-input')) { throw 'Final source lacks physical-submit stability barrier.' }
          if (!$chrome.Contains('pre-submit-cdp-recovered-before-physical-input')) { throw 'Final source lacks safe pre-submit recovery path.' }
          if (!$monitor.Contains('Chrome/CDP recovery complete: same conversation target is stable.')) { throw 'Final source lacks monitor recovery completion path.' }
          $exe = 'Output/Setup/GPTDeskTop-Setup.exe'
          if (!(Test-Path $exe)) { throw 'Setup EXE missing.' }
          $setupSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $exe).Length
          git archive --format=zip --output GPTDeskTop-v2.0.6-FINAL-SOURCE.zip HEAD
          $sourceSha = (Get-FileHash GPTDeskTop-v2.0.6-FINAL-SOURCE.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "FINAL_HEAD=$head`nBASE_V205_HEAD=fa54458a5414130e2e64b98ab63dfc57fc3c7520`nVERSION=2.0.6`nSETUP_SHA256=$setupSha`nSETUP_SIZE=$setupSize`nSOURCE_ZIP_SHA256=$sourceSha" | Set-Content FINAL-V206-IDENTITY.txt
          Write-Host "FINAL_HEAD=$head"
          Write-Host "SETUP_SHA256=$setupSha"
          Write-Host "SOURCE_ZIP_SHA256=$sourceSha"

      - name: Upload v2.0.6 final source
        if: steps.patch.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.6-FINAL-SOURCE
          path: |
            GPTDeskTop-v2.0.6-FINAL-SOURCE.zip
            FINAL-V206-IDENTITY.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload v2.0.6 final setup
        if: steps.patch.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.6-FINAL-SETUP
          path: |
            Output/Setup/GPTDeskTop-Setup.exe
            Output/Setup/Version.txt
            FINAL-V206-IDENTITY.txt
          if-no-files-found: error
          retention-days: 30
