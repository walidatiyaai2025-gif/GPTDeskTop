name: SENDHEAL one-time patch

on:
  push:
    branches:
      - agent/send-cdp-self-heal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/send-cdp-self-heal
          fetch-depth: 0

      - name: Apply SENDHEAL source and regression patch
        run: python .github/scripts/apply_sendheal.py

      - name: Commit patch and remove one-time tooling
        run: |
          git rm .github/workflows/sendheal-apply.yml .github/scripts/apply_sendheal.py
          git add src/GPTDeskTop/Services/ChromeDevToolsService.cs tests/GPTDeskTop.RuntimeTests/VerifiedSendTaskCancellationSelfHealRegressionTests.cs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SENDHEAL: self-heal verified delivery across CDP target cancellation"
          git push origin HEAD:agent/send-cdp-self-heal
