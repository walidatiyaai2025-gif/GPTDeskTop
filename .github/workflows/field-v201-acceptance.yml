name: Field v2.0.1 Acceptance

on:
  push:
    branches:
      - fix/runtime-hotfix-acceptance-sync

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore GPTDeskTop.sln

      - name: Full runtime suite
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore

      - name: Build standalone v2.0.1 setup
        shell: pwsh
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj -c Release -p:RunPackagingTargets=true

      - name: Verify setup
        shell: pwsh
        run: |
          $setup = 'Output/Setup/GPTDeskTop-Setup.exe'
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          $version = (Get-Item $setup).VersionInfo.FileVersion
          Write-Host "Setup file version: $version"
          Get-FileHash $setup -Algorithm SHA256

      - name: Upload setup exe
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.1-Final-Setup
          path: Output/Setup/GPTDeskTop-Setup.exe
          if-no-files-found: error
          retention-days: 30
