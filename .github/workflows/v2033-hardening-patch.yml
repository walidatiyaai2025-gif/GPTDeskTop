name: V2033 Monitor Only Hardening Patch

on:
  push:
    branches:
      - fix/v2033-start-monitor-only-chrome-launch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scope hardening to Monitor Only paths
        run: python scripts/v2033_scope_fix.py

      - name: Apply Monitor Only hardening
        run: python scripts/v2033_hardening_patch.py

      - name: Remove one-shot patch machinery from runner workspace
        shell: pwsh
        run: |
          Remove-Item scripts/v2033_scope_fix.py -Force
          Remove-Item scripts/v2033_hardening_patch.py -Force
          Remove-Item .github/workflows/v2033-hardening-patch.yml -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/GPTDeskTop/GPTDeskTop.csproj

      - name: Build
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release --no-restore

      - name: Runtime regression tests
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release

      - name: Commit validated hardening source only
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- `
            src/GPTDeskTop/Services/ChromeDevToolsService.cs `
            src/GPTDeskTop/Services/ChromeDevToolsSessionPool.cs `
            src/GPTDeskTop/Services/SimpleMonitorProfileSession.cs `
            src/GPTDeskTop/Services/SimpleMonitorRunner.cs `
            src/GPTDeskTop/UI/SimpleMonitorForm.cs `
            tests/GPTDeskTop.RuntimeTests/ChromeDevToolsLongRunningStabilityRegressionTests.cs `
            tests/GPTDeskTop.RuntimeTests/MonitorHotLoopPerformanceRegressionTests.cs `
            tests/GPTDeskTop.RuntimeTests/MonitorOnlyPassiveCdpHardeningRegressionTests.cs

          $staged = @(git diff --cached --name-only)
          if ($staged.Count -eq 0) { throw 'No validated source changes staged.' }
          Write-Host "Staged validated files:"
          $staged | ForEach-Object { Write-Host " - $_" }
          git commit -m "fix(monitor): harden passive CDP recovery and diagnostics"
          git push origin HEAD:fix/v2033-start-monitor-only-chrome-launch
