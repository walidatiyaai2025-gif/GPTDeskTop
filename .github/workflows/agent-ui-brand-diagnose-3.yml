name: Agent UI Brand Diagnose 3
on:
  push:
    branches: [ agent/icon-newchat-wide-monitors ]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/icon-newchat-wide-monitors
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Surface exact test failure
        shell: pwsh
        run: |
          dotnet restore tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -p:EnableWindowsTargeting=true | Out-Null
          $lines = & dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release -p:EnableWindowsTargeting=true --no-restore --logger "console;verbosity=minimal" 2>&1 | ForEach-Object { $_.ToString() }
          $picked = $lines | Where-Object { $_ -match '^\s*Failed\s+GPTDeskTop\.RuntimeTests|Error Message:|Xunit\.Sdk|Assert\.|Expected:|Actual:|Stack Trace:|at GPTDeskTop\.RuntimeTests|Failed!|Passed!|Total tests:' }
          if($picked.Count -eq 0){ $picked = $lines | Select-Object -Last 50 }
          $m=(($picked | Select-Object -Last 80)-join ' | ').Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          if($m.Length -gt 12000){$m=$m.Substring([Math]::Max(0,$m.Length-12000))}
          Write-Host "::error title=UI-BRAND exact failure::$m"
          exit 0
