name: QA Monitor Start Chrome Launch Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  start-monitor-launch-gate:
    name: Chrome launch only from initial Start Monitor authorization
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/GPTDeskTop/GPTDeskTop.csproj

      - name: Build
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release --no-restore

      - name: Enforce initial-Start-only Chrome launch contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sessionPath = 'src/GPTDeskTop/Services/SimpleMonitorProfileSession.cs'
          $formPath = 'src/GPTDeskTop/UI/SimpleMonitorForm.cs'
          $runnerPath = 'src/GPTDeskTop/Services/SimpleMonitorRunner.cs'
          $session = Get-Content $sessionPath -Raw
          $form = Get-Content $formPath -Raw
          $runner = Get-Content $runnerPath -Raw

          $processStarts = [regex]::Matches($session, 'Process\.Start\s*\(').Count
          if ($processStarts -ne 1) {
            throw "SimpleMonitorProfileSession must contain exactly one Chrome Process.Start boundary; found $processStarts."
          }

          $launchMentions = [regex]::Matches($session, 'LaunchChromeForMonitorStartAsync\s*\(').Count
          if ($launchMentions -ne 2) {
            throw "LaunchChromeForMonitorStartAsync must have exactly one definition and one initial authorized call; found $launchMentions mentions."
          }

          if ($session -notmatch 'if\s*\(openIfMissing\)[\s\S]*?_startLaunchAuthorized\s*=\s*true;[\s\S]*?EnsureStartAuthorizedBrowserAvailableAsync') {
            throw 'ResolveConversationAsync(openIfMissing:true) no longer latches Start Monitor authorization before initial browser availability is ensured.'
          }

          $runtimeRecoveryStart = $session.IndexOf('public async Task RecoverAfterAuthorizedStartAsync', [StringComparison]::Ordinal)
          $closeTabsStart = $session.IndexOf('public async Task CloseAutomationOwnedChatTabsAsync', [StringComparison]::Ordinal)
          if ($runtimeRecoveryStart -lt 0 -or $closeTabsStart -le $runtimeRecoveryStart) {
            throw 'Could not isolate running-monitor recovery body.'
          }
          $runtimeRecoveryBody = $session.Substring($runtimeRecoveryStart, $closeTabsStart - $runtimeRecoveryStart)
          if ($runtimeRecoveryBody -notmatch 'EnsureRuntimeSelectedBrowserAvailableAsync') {
            throw 'Running-monitor recovery no longer uses the passive same-session availability probe.'
          }
          if ($runtimeRecoveryBody -match 'EnsureStartAuthorizedBrowserAvailableAsync|LaunchChromeForMonitorStartAsync|Process\.Start') {
            throw 'Running-monitor recovery can reach an initial browser-launch path.'
          }

          $passiveRecoveryStart = $session.IndexOf('private async Task EnsureRuntimeSelectedBrowserAvailableAsync', [StringComparison]::Ordinal)
          $initialAvailabilityStart = $session.IndexOf('private async Task EnsureStartAuthorizedBrowserAvailableAsync', [StringComparison]::Ordinal)
          if ($passiveRecoveryStart -lt 0 -or $initialAvailabilityStart -le $passiveRecoveryStart) {
            throw 'Could not isolate passive runtime browser availability method.'
          }
          $passiveRecoveryBody = $session.Substring($passiveRecoveryStart, $initialAvailabilityStart - $passiveRecoveryStart)
          if ($passiveRecoveryBody -match 'LaunchChromeForMonitorStartAsync|Process\.Start') {
            throw 'Passive runtime browser availability is allowed to launch Chrome.'
          }
          if ($passiveRecoveryBody -notmatch 'Runtime recovery is passive' -or $passiveRecoveryBody -notmatch 'never opening Chrome') {
            throw 'Passive runtime recovery no longer documents the no-autolaunch contract.'
          }

          $initialAvailabilityEnd = $session.IndexOf('private async Task LaunchChromeForMonitorStartAsync', [StringComparison]::Ordinal)
          $initialAvailabilityBody = $session.Substring($initialAvailabilityStart, $initialAvailabilityEnd - $initialAvailabilityStart)
          if ($initialAvailabilityBody -notmatch 'if\s*\(_lastEndpointSeenUtc is not null\)[\s\S]*?throw new TimeoutException[\s\S]*?LaunchChromeForMonitorStartAsync') {
            throw 'An already-observed selected CDP endpoint can still fall through to a second Chrome launch.'
          }

          if ($session -notmatch 'public async Task EnsureConnectedAsync[\s\S]*?_ = await TryEnsureConnectedAsync') {
            throw 'Pre-start EnsureConnectedAsync no longer delegates only to the passive boolean endpoint probe.'
          }
          if ($session -notmatch 'public Task<bool> TryEnsureConnectedAsync[\s\S]*?=> CanReadEndpointAsync\(cancellationToken\);') {
            throw 'TryEnsureConnectedAsync must remain a direct passive endpoint probe.'
          }

          $ensureStart = $session.IndexOf('public async Task EnsureConnectedAsync', [StringComparison]::Ordinal)
          $getTabsStart = $session.IndexOf('public async Task<IReadOnlyList<ChromeTab>> GetConversationTabsAsync', [StringComparison]::Ordinal)
          if ($ensureStart -lt 0 -or $getTabsStart -le $ensureStart) { throw 'Could not isolate passive connection probes.' }
          $ensureBody = $session.Substring($ensureStart, $getTabsStart - $ensureStart)
          if ($ensureBody -match 'Process\.Start|LaunchChromeForMonitorStartAsync|CreateTabAsync|CreateNewChatTabAsync|RecoverAfterAuthorizedStartAsync') {
            throw 'Pre-start connection probes contain a browser mutation.'
          }

          $getTabsEnd = $session.IndexOf('public async Task<ChromeTab?> ResolveConversationAsync', [StringComparison]::Ordinal)
          $getTabsBody = $session.Substring($getTabsStart, $getTabsEnd - $getTabsStart)
          if ($getTabsBody -match 'Process\.Start|LaunchChromeForMonitorStartAsync|CreateTabAsync|CreateNewChatTabAsync|RecoverAfterAuthorizedStartAsync') {
            throw 'GetConversationTabsAsync must remain passive and may not launch/mutate Chrome.'
          }

          $uiLaunchAuthorizations = [regex]::Matches($form, 'ResolveConversationAsync\s*\(\s*url\s*,\s*openIfMissing:\s*true\s*\)').Count
          if ($uiLaunchAuthorizations -ne 1) {
            throw "The Monitor Only UI must contain exactly one explicit initial launch authorization; found $uiLaunchAuthorizations."
          }

          $startMethod = $form.IndexOf('private async Task StartMonitorAsync()', [StringComparison]::Ordinal)
          $checkpointMethod = $form.IndexOf('private async Task CheckpointPlanMessageSentAsync', [StringComparison]::Ordinal)
          $authorizedCall = $form.IndexOf('ResolveConversationAsync(url, openIfMissing: true)', [StringComparison]::Ordinal)
          if ($startMethod -lt 0 -or $checkpointMethod -le $startMethod -or $authorizedCall -lt $startMethod -or $authorizedCall -ge $checkpointMethod) {
            throw 'The only UI launch-authorized ResolveConversationAsync call is not inside StartMonitorAsync.'
          }

          if ($form -match 'RecoverAfterAuthorizedStartAsync') {
            throw 'Passive UI paths must never invoke runtime Chrome recovery directly.'
          }

          if ($runner -notmatch 'RecoverAfterAuthorizedStartAsync') {
            throw 'The running monitor no longer keeps its passive same-session recovery loop.'
          }
          if ($runner -match 'Process\.Start|LaunchChromeForMonitorStartAsync') {
            throw 'SimpleMonitorRunner may request passive same-session recovery but may not own the Chrome process-launch primitive.'
          }

          Write-Host 'PASS: Chrome can launch only during the initial explicit Start Monitor transition. Once monitoring has attached, runtime recovery is passive and can never open another Chrome.'
