name: Integrate Conversation Handoff

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[handoff-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch monitor rotation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/GPTDeskTop/Services/ChatGptMonitorService.cs')
          s = p.read_text(encoding='utf-8')

          if 'handoffService.BuildAsync(monitor, text, oldTab' in s:
              print('Handoff already integrated.')
              raise SystemExit(0)

          pattern = r'(?m)^(?P<i>\s*)var startMessage = string\.IsNullOrWhiteSpace\(monitor\.NewChatStartMessage\) \? "كمل" : monitor\.NewChatStartMessage;\n(?P=i)var sent = await _chrome\.SendChatMessageAsync\(newTab, startMessage, cancellationToken\);'
          replacement = r'''\g<i>var handoffService = new ConversationHandoffService(_database);
          \g<i>var handoffMessage = await handoffService.BuildAsync(monitor, text, oldTab, cancellationToken);
          \g<i>var startMessage = string.IsNullOrWhiteSpace(handoffMessage)
          \g<i>    ? (string.IsNullOrWhiteSpace(monitor.NewChatStartMessage) ? "كمل" : monitor.NewChatStartMessage)
          \g<i>    : handoffMessage;
          \g<i>var sent = await _chrome.SendChatMessageAsync(newTab, startMessage, cancellationToken);'''

          updated, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit('Expected rotation send block was not found; refusing to modify the file.')

          p.write_text(updated, encoding='utf-8')
          print('Conversation handoff integrated into context rotation.')
          PY

      - name: Validate solution
        run: dotnet build GPTDeskTop.sln --configuration Release --no-restore

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GPTDeskTop/Services/ChatGptMonitorService.cs
          git diff --cached --quiet && exit 0
          git commit -m "fix: use bounded conversation handoff during rotation [handoff-bot]"
          git push

      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/integrate-handoff.yml
          git commit -m "chore: remove one-shot handoff integration workflow [handoff-bot]"
          git push
