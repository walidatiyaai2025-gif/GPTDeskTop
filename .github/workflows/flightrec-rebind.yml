name: FLIGHTREC Rebind Integrate

on:
  push:
    branches:
      - agent/runtime-flight-recorder
    paths:
      - 'scripts/apply-flight-recorder-rebind.py'
      - '.github/workflows/flightrec-rebind.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-flight-recorder
          fetch-depth: 0
      - name: Apply browser rebind flight recorder patch
        run: python scripts/apply-flight-recorder-rebind.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'FLIGHTREC capture browser binding refresh and URL transitions'
          git push origin HEAD:agent/runtime-flight-recorder
