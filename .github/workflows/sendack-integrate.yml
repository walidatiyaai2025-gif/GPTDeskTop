name: SENDACK Integrate

on:
  push:
    branches:
      - agent/send-ack-reconciliation
    paths:
      - 'scripts/apply-sendack-reconciliation.py'
      - '.github/workflows/sendack-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/send-ack-reconciliation
          fetch-depth: 0
      - name: Apply SENDACK reconciliation
        run: python scripts/apply-sendack-reconciliation.py
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GPTDeskTop/Services/ChromeDevToolsService.cs src/GPTDeskTop/Services/RuntimeInspectorService.cs
          git commit -m 'SENDACK reconcile unacknowledged submit before bounded retry'
          git push origin HEAD:agent/send-ack-reconciliation
