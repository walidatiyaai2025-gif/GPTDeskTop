name: GPTDeskTop v2.0.5 Verified Turn Submit

on:
  push:
    branches:
      - hotfix/v205-verified-turn-submit

permissions:
  contents: write

jobs:
  patch-validate-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: hotfix/v205-verified-turn-submit
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply one-shot v2.0.5 source hotfix
        id: patch
        shell: pwsh
        run: |
          if (Test-Path 'tools/apply_v205_verified_turn_submit.py') {
            python tools/apply_v205_verified_turn_submit.py
            git config user.name "gptdesktop-runtime-worker"
            git config user.email "actions@users.noreply.github.com"
            git rm tools/apply_v205_verified_turn_submit.py
            git add src tests tools
            if (git status --porcelain) {
              git commit -m "fix(runtime): require verified user-turn acceptance for physical submit"
              git push origin HEAD:hotfix/v205-verified-turn-submit
              "changed=true" >> $env:GITHUB_OUTPUT
            } else {
              "changed=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Defer validation to exact committed source
        if: steps.patch.outputs.changed == 'true'
        shell: pwsh
        run: Write-Host 'v2.0.5 source committed. Push-triggered exact-head run will validate and package.'

      - name: Setup .NET 8
        if: steps.patch.outputs.changed == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet restore GPTDeskTop.sln

      - name: Focused verified-submit regression tests
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --filter "FullyQualifiedName~PhysicalSubmitAcceptanceRegressionTests|FullyQualifiedName~VerifiedSendTransportRecoveryRegressionTests|FullyQualifiedName~VerifiedSendTaskCancellationSelfHealRegressionTests|FullyQualifiedName~VerifiedSendReloadHydrationPolicyTests" --logger "trx;LogFileName=v205-verified-submit.trx"

      - name: Full runtime and product suite
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --logger "trx;LogFileName=v205-full-runtime.trx"

      - name: Release x64 build
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release -r win-x64

      - name: Build final Setup EXE
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj -c Release -p:RunPackagingTargets=true

      - name: Verify exact head and package final source
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor c36c1aab246ffb6c91646555063a249fc16baa8a HEAD
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.5 source lost v2.0.4 convergence ancestry.' }
          $app = Get-Content 'src/GPTDeskTop/GPTDeskTop.csproj' -Raw
          if (!$app.Contains('<Version>2.0.5</Version>')) { throw 'Application version is not 2.0.5.' }
          $exe = 'Output/Setup/GPTDeskTop-Setup.exe'
          if (!(Test-Path $exe)) { throw 'Setup EXE missing.' }
          $setupSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $exe).Length
          git archive --format=zip --output GPTDeskTop-v2.0.5-FINAL-SOURCE.zip HEAD
          $sourceSha = (Get-FileHash GPTDeskTop-v2.0.5-FINAL-SOURCE.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "FINAL_HEAD=$head`nBASE_V204_HEAD=c36c1aab246ffb6c91646555063a249fc16baa8a`nVERSION=2.0.5`nSETUP_SHA256=$setupSha`nSETUP_SIZE=$setupSize`nSOURCE_ZIP_SHA256=$sourceSha" | Set-Content FINAL-V205-IDENTITY.txt
          Write-Host "FINAL_HEAD=$head"
          Write-Host "SETUP_SHA256=$setupSha"
          Write-Host "SOURCE_ZIP_SHA256=$sourceSha"

      - name: Upload v2.0.5 final source
        if: steps.patch.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.5-FINAL-SOURCE
          path: |
            GPTDeskTop-v2.0.5-FINAL-SOURCE.zip
            FINAL-V205-IDENTITY.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload v2.0.5 final setup
        if: steps.patch.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.5-FINAL-SETUP
          path: |
            Output/Setup/GPTDeskTop-Setup.exe
            Output/Setup/Version.txt
            FINAL-V205-IDENTITY.txt
          if-no-files-found: error
          retention-days: 30
