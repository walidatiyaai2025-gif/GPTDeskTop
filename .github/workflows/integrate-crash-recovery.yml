name: Integrate Chrome crash recovery

on:
  push:
    branches: [main]

jobs:
  integrate:
    if: github.event.head_commit.message != 'chore: remove crash recovery integration workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Patch Chrome restart API and monitor recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chrome = Path('src/GPTDeskTop/Services/ChromeDevToolsService.cs')
          s = chrome.read_text(encoding='utf-8')
          marker = '    public async Task<ChromeTab> CreateTabAsync(string url, CancellationToken cancellationToken = default)\n'
          if 'RestartMonitorChromeAsync' not in s:
              method = '''    public async Task RestartMonitorChromeAsync(CancellationToken cancellationToken = default)\n    {\n        try { await CloseAllMonitorTabsAsync(cancellationToken); } catch { }\n\n        var process = _monitorChromeProcess;\n        _monitorChromeProcess = null;\n        _lastKnownWindowHandle = IntPtr.Zero;\n\n        if (process is not null)\n        {\n            try\n            {\n                if (!process.HasExited)\n                {\n                    process.Kill(entireProcessTree: true);\n                    await process.WaitForExitAsync(cancellationToken);\n                }\n            }\n            catch (InvalidOperationException) { }\n            catch (System.ComponentModel.Win32Exception) { }\n            finally { process.Dispose(); }\n        }\n\n        LaunchMonitorChrome();\n        for (var attempt = 0; attempt < 40; attempt++)\n        {\n            cancellationToken.ThrowIfCancellationRequested();\n            try\n            {\n                if ((await GetTabsAsync(cancellationToken)).Count > 0) return;\n            }\n            catch { }\n            await Task.Delay(250, cancellationToken);\n        }\n\n        throw new TimeoutException("Monitor Chrome restarted, but no controllable tab became available.");\n    }\n\n'''
              if marker not in s:
                  raise SystemExit('Chrome insertion marker not found')
              s = s.replace(marker, method + marker, 1)
              chrome.write_text(s, encoding='utf-8')

          monitor = Path('src/GPTDeskTop/Services/ChatGptMonitorService.cs')
          s = monitor.read_text(encoding='utf-8')
          if 'private readonly ChromeRecoveryService _recovery;' not in s:
              s = s.replace('    private readonly ModelRoutingService _modelRouting = new();\n', '    private readonly ModelRoutingService _modelRouting = new();\n    private readonly ChromeRecoveryService _recovery;\n', 1)
              s = s.replace('        _config = config;\n', '        _config = config;\n        _recovery = new ChromeRecoveryService(chrome, database);\n', 1)

          s = s.replace('        var transientFailures = 0;\n', '        var transientFailures = 0;\n        var lastRecoveryAt = DateTimeOffset.MinValue;\n', 1)

          old = '''                    var prefix = $"[{monitor.Title}]";\n                    var state = await _chrome.GetChatStateAsync(tab, cancellationToken);\n'''
          new = '''                    var prefix = $"[{monitor.Title}]";\n                    tab = await ResolveCurrentTabAsync(monitor, tab, cancellationToken);\n                    var state = await _chrome.GetChatStateAsync(tab, cancellationToken);\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''                    else if (transientFailures == 4)\n                        Activity?.Invoke(monitor.Id, "CDP is temporarily unavailable. Background retry continues; this is not counted as an application crash.");\n\n                    await Task.Delay(TimeSpan.FromMilliseconds(Math.Min(5000, 750 * transientFailures)), cancellationToken);\n'''
          new = '''                    else if (transientFailures == 4)\n                    {\n                        Activity?.Invoke(monitor.Id, "CDP has remained unavailable. Performing one conservative Chrome recovery: close/reopen monitor tabs and resume from their saved conversations.");\n                        if ((DateTimeOffset.UtcNow - lastRecoveryAt).TotalSeconds >= 60)\n                        {\n                            lastRecoveryAt = DateTimeOffset.UtcNow;\n                            try\n                            {\n                                var recovered = await _recovery.RecoverAsync($"CDP transient failure: {ex.GetType().Name}: {ex.Message}", cancellationToken);\n                                if (recovered.TryGetValue(monitor.Id, out var recoveredTab)) tab = recoveredTab;\n                                transientFailures = 0;\n                                RunningStateChanged?.Invoke();\n                            }\n                            catch (Exception recoveryEx) when (recoveryEx is not OperationCanceledException)\n                            {\n                                await ExceptionLogService.LogAsync(recoveryEx, "ChatGptMonitorService.ChromeRecovery", monitor.Id, tab.Id, monitor.Title);\n                                Activity?.Invoke(monitor.Id, $"Chrome recovery failed; conservative retry remains active: {recoveryEx.Message}");\n                            }\n                        }\n                    }\n\n                    await Task.Delay(TimeSpan.FromMilliseconds(Math.Min(5000, 750 * Math.Max(1, transientFailures))), cancellationToken);\n'''
          if old not in s:
              raise SystemExit('Transient recovery block not found')
          s = s.replace(old, new, 1)

          old = '''        catch (Exception ex)\n        {\n            await ExceptionLogService.LogAsync(ex, "ChatGptMonitorService.WorkerFatal", monitor.Id, tab.Id, monitor.Title);\n            Activity?.Invoke(monitor.Id, $"Monitor worker stopped by exception: {ex.Message}");\n        }\n'''
          new = '''        catch (Exception ex)\n        {\n            await ExceptionLogService.LogAsync(ex, "ChatGptMonitorService.WorkerFatal", monitor.Id, tab.Id, monitor.Title);\n            Activity?.Invoke(monitor.Id, $"Monitor worker hit a fatal browser/session exception. Starting conservative Chrome recovery...");\n            try\n            {\n                var recovered = await _recovery.RecoverAsync($"Monitor worker fatal exception: {ex.GetType().Name}: {ex.Message}", CancellationToken.None);\n                if (recovered.TryGetValue(monitor.Id, out var recoveredTab))\n                    Activity?.Invoke(monitor.Id, $"Chrome recovery reopened the monitor conversation at tab {recoveredTab.Id}. Restart the monitor if this worker does not resume.");\n                RunningStateChanged?.Invoke();\n            }\n            catch (Exception recoveryEx)\n            {\n                await ExceptionLogService.LogAsync(recoveryEx, "ChatGptMonitorService.WorkerFatalRecovery", monitor.Id, tab.Id, monitor.Title);\n                Activity?.Invoke(monitor.Id, $"Chrome recovery failed: {recoveryEx.Message}");\n            }\n        }\n'''
          if old not in s:
              raise SystemExit('Fatal block not found')
          s = s.replace(old, new, 1)

          marker = '    private async Task ApplyModelRouteAsync(SavedMonitor monitor, ChromeTab tab, bool recovery, bool contextRotation, CancellationToken cancellationToken)\n'
          helper = '''    private async Task<ChromeTab> ResolveCurrentTabAsync(SavedMonitor monitor, ChromeTab current, CancellationToken cancellationToken)\n    {\n        try\n        {\n            var tabs = await _chrome.GetTabsAsync(cancellationToken);\n            var byId = tabs.FirstOrDefault(t => string.Equals(t.Id, monitor.TabId, StringComparison.Ordinal));\n            if (byId is not null) return byId;\n            var byUrl = tabs.FirstOrDefault(t => !string.IsNullOrWhiteSpace(monitor.Url) && string.Equals(t.Url, monitor.Url, StringComparison.OrdinalIgnoreCase));\n            return byUrl ?? current;\n        }\n        catch (Exception ex) when (IsTransientChromeException(ex))\n        {\n            return current;\n        }\n    }\n\n'''
          if 'ResolveCurrentTabAsync' not in s:
              if marker not in s:
                  raise SystemExit('Helper insertion marker not found')
              s = s.replace(marker, helper + marker, 1)

          monitor.write_text(s, encoding='utf-8')
          print('Crash recovery integration patched.')
          PY
      - name: Restore and validate
        run: |
          dotnet restore GPTDeskTop.sln -p:EnableWindowsTargeting=true
          dotnet build GPTDeskTop.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GPTDeskTop/Services/ChromeDevToolsService.cs src/GPTDeskTop/Services/ChatGptMonitorService.cs .github/workflows/integrate-crash-recovery.yml
          git commit -m 'feat: recover monitor sessions after Chrome CDP crashes' || exit 0
          git push origin HEAD:main
      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/integrate-crash-recovery.yml
          git commit -m 'chore: remove crash recovery integration workflow'
          git push origin HEAD:main
