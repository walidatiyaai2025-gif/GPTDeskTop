name: FLOW-001 Apply Main Window Patch

on:
  push:
    branches:
      - agent/flow-001-new-chat-monitor
    paths:
      - tools/apply-flow-001.ps1
      - .github/workflows/flow-001-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/flow-001-new-chat-monitor
          fetch-depth: 0

      - name: Apply FLOW-001 MainForm patch
        shell: pwsh
        run: ./tools/apply-flow-001.ps1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore runtime tests
        shell: pwsh
        run: dotnet restore tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -p:EnableWindowsTargeting=true

      - name: Validate FLOW-001 and runtime regression suite
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Commit patched source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GPTDeskTop/UI/MainForm.cs
          if (git diff --cached --quiet) { throw 'FLOW-001 patch produced no MainForm changes.' }
          git commit -m "feat: expose New Chat + Monitor workflow [skip ci]"
          git push origin HEAD:agent/flow-001-new-chat-monitor
