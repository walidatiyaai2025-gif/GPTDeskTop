name: QA Idle No Managed Chrome

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  idle-no-managed-chrome:
    name: Idle cold start preserves healthy selected Chrome only
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore runtime tests
        run: dotnet restore tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj

      - name: Run idle cold-start regression tests
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --filter "FullyQualifiedName~MonitorOnlyVisualHotfixRegressionTests|FullyQualifiedName~MonitorOnlyIdleChromeGuardRegressionTests"

      - name: Enforce selected-live adoption and ownership isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $startup = Get-Content 'src/GPTDeskTop/UI/MonitorOnlyStartupGate.cs' -Raw
          $guard = Get-Content 'src/GPTDeskTop/Services/MonitorOnlyManagedChromeGuard.cs' -Raw
          $reconciler = Get-Content 'src/GPTDeskTop/Services/MonitorOnlyColdStartChromeReconciler.cs' -Raw

          $profile = $startup.IndexOf('ResolveSavedSelectedProfile(database)', [StringComparison]::Ordinal)
          $guardStart = $startup.IndexOf('MonitorOnlyManagedChromeGuard.Start(savedSelectedProfile)', [StringComparison]::Ordinal)
          $cleanup = $startup.IndexOf('MonitorOnlyColdStartChromeReconciler.ReconcileBeforeIdleUi(savedSelectedProfile)', [StringComparison]::Ordinal)
          $form = $startup.IndexOf('new SimpleMonitorForm(database)', [StringComparison]::Ordinal)
          if ($profile -lt 0 -or $guardStart -le $profile -or $cleanup -le $guardStart -or $form -le $cleanup) {
            throw 'Saved-profile adoption, lifetime guard, cold-start reconciliation and UI ordering are invalid.'
          }

          if ($guard -notmatch 'TryResolveHealthySavedSelection' -or $guard -notmatch 'IsEndpointAlive\(port\)') {
            throw 'Lifetime guard cannot prove and adopt the healthy saved selected managed Chrome.'
          }
          if ($reconciler -notmatch 'selectedEndpointAlive' -or $reconciler -notmatch 'preserveSelected') {
            throw 'Cold-start reconciliation does not distinguish a healthy selected managed Chrome from stale residue.'
          }
          if ($reconciler -notmatch 'invalidSurvivors' -or $reconciler -notmatch 'Competing GPTDeskTop-managed Chrome') {
            throw 'Cold-start reconciliation no longer fails closed on competing managed Chrome survivors.'
          }
          if ($reconciler -notmatch 'ChromeProfileCatalog\.Discover\(\)' -or $reconciler -notmatch '--user-data-dir=') {
            throw 'Cold-start reconciliation is not scoped to GPTDeskTop managed Chrome profile roots.'
          }
          if ($reconciler -notmatch "WHERE Name='chrome\.exe'" -or $reconciler -notmatch 'CommandLineReferencesUserDataDirectory') {
            throw 'Cold-start reconciliation no longer verifies Chrome command-line ownership.'
          }
          if ($reconciler -match 'GetProcessesByName' -or $guard -match 'GetProcessesByName') {
            throw 'Broad Chrome process enumeration is forbidden; ordinary user Chrome must remain untouched.'
          }

          Write-Host 'PASS: cold start preserves only a verified healthy selected managed Chrome, removes stale/competing managed Chrome, and leaves ordinary Chrome outside the ownership filter.'
