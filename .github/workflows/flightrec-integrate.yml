name: FLIGHTREC Integrate

on:
  push:
    branches:
      - agent/runtime-flight-recorder
    paths:
      - 'scripts/apply-flight-recorder-integration.py'
      - '.github/workflows/flightrec-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-flight-recorder
          fetch-depth: 0
      - name: Apply flight recorder integration
        run: python scripts/apply-flight-recorder-integration.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git commit -m 'FLIGHTREC wire inspector monitor and CDP event capture'
          git push origin HEAD:agent/runtime-flight-recorder
