name: Apply CDP startup recovery hotfix

on:
  push:
    branches:
      - fix/cdp-startup-recovery-v2.0.16

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cdp-startup-recovery-v2.0.16
          fetch-depth: 0
      - name: Apply focused runtime patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/GPTDeskTop/Services/ChatGptMonitorService.cs'
          $source = Get-Content $path -Raw
          $startMarker = '    private async Task<ChatPageState> GetChatStateWithRetryAsync(long monitorId, ChromeTab tab, CancellationToken cancellationToken)'
          $endMarker = '    private static bool IsTransientChromeException(Exception ex)'
          $start = $source.IndexOf($startMarker, [StringComparison]::Ordinal)
          $end = $source.IndexOf($endMarker, $start, [StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -le $start) { throw 'Could not locate startup CDP retry block.' }
          $replacement = @'
              private async Task<ChatPageState> GetChatStateWithRetryAsync(long monitorId, ChromeTab tab, CancellationToken cancellationToken)
              {
                  long attempt = 0;
                  while (true)
                  {
                      cancellationToken.ThrowIfCancellationRequested();
                      attempt++;
                      try
                      {
                          return await _chrome.GetChatStateAsync(tab, cancellationToken);
                      }
                      catch (Exception ex) when (!cancellationToken.IsCancellationRequested && IsTransientChromeException(ex))
                      {
                          if (attempt <= 3)
                              Activity?.Invoke(monitorId, $"Initial Chrome/CDP connection retry {attempt}: {ex.GetType().Name}");
                          else if (attempt == 4)
                              Activity?.Invoke(monitorId, "Chrome/CDP is temporarily unavailable during startup. Monitor remains active; background recovery will continue until Chrome returns or the monitor is stopped.");
                          else if (attempt % 12 == 0)
                              Activity?.Invoke(monitorId, $"Chrome/CDP is still unavailable during startup after {attempt} attempts. Monitor remains active and recovery continues.");

                          await Task.Delay(
                              TimeSpan.FromMilliseconds(Math.Min(5000L, 750L * attempt)),
                              cancellationToken);
                      }
                  }
              }

          '@
          $replacement = $replacement -replace '(?m)^          ', ''
          $source = $source.Substring(0, $start) + $replacement + $source.Substring($end)
          $source = [regex]::Replace(
              $source,
              '(?m)^    private static bool IsTransientChromeException\(Exception ex\) =>.*;$',
              '    private static bool IsTransientChromeException(Exception ex) => ChromeTransportFailureClassifier.IsTransient(ex);',
              1)
          Set-Content -Path $path -Value $source -NoNewline -Encoding utf8

          $propsPath = 'Directory.Build.props'
          $props = Get-Content $propsPath -Raw
          if (-not $props.Contains('<GPTDeskTopVersion>2.0.15</GPTDeskTopVersion>')) { throw 'Expected 2.0.15 canonical version was not found.' }
          $props = $props.Replace('<GPTDeskTopVersion>2.0.15</GPTDeskTopVersion>', '<GPTDeskTopVersion>2.0.16</GPTDeskTopVersion>')
          Set-Content -Path $propsPath -Value $props -NoNewline -Encoding utf8

          $testPath = 'tests/GPTDeskTop.RuntimeTests/MonitorStartupCdpRecoveryRegressionTests.cs'
          @'
          using System.Reflection;
          using GPTDeskTop.Services;

          namespace GPTDeskTop.RuntimeTests;

          public sealed class MonitorStartupCdpRecoveryRegressionTests
          {
              private static string RepositoryPath(params string[] segments)
                  => Path.GetFullPath(Path.Combine(
                      AppContext.BaseDirectory,
                      "..", "..", "..", "..", "..",
                      Path.Combine(segments)));

              [Fact]
              public void StartupCdpRecoveryDoesNotStopAfterThreeTransientFailures()
              {
                  var source = File.ReadAllText(RepositoryPath(
                      "src", "GPTDeskTop", "Services", "ChatGptMonitorService.cs"));
                  var start = source.IndexOf(
                      "private async Task<ChatPageState> GetChatStateWithRetryAsync",
                      StringComparison.Ordinal);
                  var end = source.IndexOf(
                      "private static bool IsTransientChromeException",
                      start,
                      StringComparison.Ordinal);

                  Assert.True(start >= 0);
                  Assert.True(end > start);
                  var body = source[start..end];
                  Assert.Contains("while (true)", body, StringComparison.Ordinal);
                  Assert.Contains("attempt == 4", body, StringComparison.Ordinal);
                  Assert.Contains("Monitor remains active; background recovery will continue", body, StringComparison.Ordinal);
                  Assert.DoesNotContain("for (var attempt = 1; attempt <= 3", body, StringComparison.Ordinal);
                  Assert.DoesNotContain("throw last ??", body, StringComparison.Ordinal);
              }

              [Fact]
              public void StartupRetriesCanReachTheChromeRecoveryThreshold()
              {
                  var monitorSource = File.ReadAllText(RepositoryPath(
                      "src", "GPTDeskTop", "Services", "ChatGptMonitorService.cs"));
                  var chromeSource = File.ReadAllText(RepositoryPath(
                      "src", "GPTDeskTop", "Services", "ChromeDevToolsService.cs"));

                  Assert.Contains("MonitorRecoveryFailureThreshold = 4", chromeSource, StringComparison.Ordinal);
                  Assert.Contains("while (true)", monitorSource, StringComparison.Ordinal);
                  Assert.Contains("attempt == 4", monitorSource, StringComparison.Ordinal);
              }

              [Fact]
              public void MonitorUsesCanonicalChromeTransportClassifier()
              {
                  var method = typeof(ChatGptMonitorService).GetMethod(
                      "IsTransientChromeException",
                      BindingFlags.NonPublic | BindingFlags.Static);

                  Assert.NotNull(method);
                  Assert.True((bool)method!.Invoke(null, [new IOException("session was invalidated")])!);
                  Assert.True((bool)method.Invoke(null, [new HttpRequestException("connection refused")])!);
                  Assert.True((bool)method.Invoke(null, [new ObjectDisposedException("cdp")])!);
                  Assert.False((bool)method.Invoke(null, [new InvalidOperationException("permanent application failure")])!);
              }
          }
          '@ | Set-Content -Path $testPath -Encoding utf8

          git rm '.github/workflows/apply-cdp-startup-hotfix.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path $propsPath $testPath
          git commit -m 'Fix CDP startup recovery and publish 2.0.16'
          git push origin HEAD:fix/cdp-startup-recovery-v2.0.16
