name: Agent sync latest main

on:
  push:
    branches:
      - agent/recover-missing-monitor-tabs-shutdown-loading
    paths:
      - .github/workflows/agent-sync-latest-main.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-missing-monitor-tabs-shutdown-loading
          fetch-depth: 0
      - name: Merge latest main
        shell: pwsh
        run: ./.github/scripts/sync-latest-main.ps1
