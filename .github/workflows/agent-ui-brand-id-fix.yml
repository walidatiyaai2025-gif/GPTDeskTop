name: Agent UI Brand ID Fix
on:
  push:
    branches: [ agent/icon-newchat-wide-monitors ]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[agent-brand-id-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/icon-newchat-wide-monitors
          fetch-depth: 0
      - name: Reconcile planning task ID
        shell: pwsh
        run: |
          $p = Get-Content TaskPlanner.md -Raw
          $p = $p.Replace('| UI-022 | Brand GPTDeskTop with the supplied icon, make Saved Monitors the dominant 72% workspace, hide Auto Reply from the dashboard surface, and harden New Chat + Monitor receipt verification across first-message navigation |', '| UI-BRAND-001 | Brand GPTDeskTop with the supplied icon, make Saved Monitors the dominant 72% workspace, hide Auto Reply from the dashboard surface, and harden New Chat + Monitor receipt verification across first-message navigation |')
          Set-Content TaskPlanner.md $p -NoNewline
          $s = Get-Content docs/DEVELOPMENT_STATUS.md -Raw
          $s = $s.Replace('## UI-022 — Branded wide Saved Monitors + first-message CDP rebind', '## UI-BRAND-001 — Branded wide Saved Monitors + first-message CDP rebind')
          Set-Content docs/DEVELOPMENT_STATUS.md $s -NoNewline
          Remove-Item .github/workflows/agent-ui-brand-id-fix.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: reconcile UI brand task id [agent-brand-id-fixed]'
          git push origin HEAD:agent/icon-newchat-wide-monitors
