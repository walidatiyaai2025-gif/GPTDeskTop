name: Agent MainForm recovery patch

on:
  push:
    branches:
      - agent/recover-missing-monitor-tabs-shutdown-loading
    paths:
      - .github/workflows/agent-mainform-recovery-patch.yml
      - .github/scripts/patch-mainform-recovery.ps1

permissions:
  contents: write

jobs:
  patch-mainform:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-missing-monitor-tabs-shutdown-loading
          fetch-depth: 0
      - name: Apply MainForm patch
        shell: pwsh
        run: ./.github/scripts/patch-mainform-recovery.ps1
