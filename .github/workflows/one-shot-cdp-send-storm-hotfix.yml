name: One-shot CDP send-storm hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-cdp-send-storm-hotfix.yml

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch fix branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix-cdp-send-storm
          git checkout -B fix-cdp-send-storm origin/fix-cdp-send-storm
          python - <<'PY'
          from pathlib import Path

          p = Path('src/GPTDeskTop/Services/ChromeDevToolsService.cs')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} target not found')
              s = s.replace(old, new, 1)

          replace_once(
              'using System.Diagnostics;\nusing System.Net.WebSockets;\nusing System.Runtime.InteropServices;\nusing System.Text.Json;',
              'using System.Diagnostics;\nusing System.Net.WebSockets;\nusing System.Runtime.InteropServices;\nusing System.Security.Cryptography;\nusing System.Text;\nusing System.Text.Json;',
              'usings')

          replace_once(
              '    private const int MonitorRecoveryEndpointGraceDelayMs = 250;\n    private const string BrowserSessionId = "__gptdesktop_monitor_browser__";',
              '    private const int MonitorRecoveryEndpointGraceDelayMs = 250;\n    private const int EndpointRecoveryFailureThreshold = 4;\n    private const int EndpointRecoveryProbeAttempts = 12;\n    private const int EndpointRecoveryProbeDelayMs = 500;\n    private static readonly TimeSpan DeliverySubmissionFenceLifetime = TimeSpan.FromMinutes(10);\n    private const string BrowserSessionId = "__gptdesktop_monitor_browser__";',
              'constants')

          replace_once(
              '    private readonly SemaphoreSlim _monitorBrowserRecoveryGate = new(1, 1);\n    private readonly object _chatStateFailureSync = new();\n    private readonly Dictionary<string, int> _chatStateTransportFailures = new(StringComparer.Ordinal);',
              '    private readonly SemaphoreSlim _monitorBrowserRecoveryGate = new(1, 1);\n    private readonly SemaphoreSlim _endpointRecoveryGate = new(1, 1);\n    private readonly object _chatStateFailureSync = new();\n    private readonly Dictionary<string, int> _chatStateTransportFailures = new(StringComparer.Ordinal);\n    private readonly object _deliverySubmissionFenceSync = new();\n    private readonly Dictionary<string, DateTimeOffset> _deliverySubmissionFences = new(StringComparer.Ordinal);\n    private int _endpointTransportFailures;',
              'fields')

          old = '''    public async Task<List<ChromeTab>> GetTabsAsync(CancellationToken cancellationToken = default) { using var response = await _httpClient.GetAsync($"{_config.DebuggingBaseUrl.TrimEnd('/')}/json/list", cancellationToken); response.EnsureSuccessStatusCode(); var json = await response.Content.ReadAsStringAsync(cancellationToken); using var document = JsonDocument.Parse(json); var tabs = new List<ChromeTab>(); foreach (var item in document.RootElement.EnumerateArray()) { var type = item.TryGetProperty("type", out var typeElement) ? typeElement.GetString() ?? string.Empty : string.Empty; if (!string.Equals(type, "page", StringComparison.OrdinalIgnoreCase)) continue; tabs.Add(new ChromeTab { Id = item.TryGetProperty("id", out var id) ? id.GetString() ?? string.Empty : string.Empty, Title = item.TryGetProperty("title", out var title) ? title.GetString() ?? string.Empty : string.Empty, Url = item.TryGetProperty("url", out var url) ? url.GetString() ?? string.Empty : string.Empty, Type = type, WebSocketDebuggerUrl = item.TryGetProperty("webSocketDebuggerUrl", out var ws) ? ws.GetString() ?? string.Empty : string.Empty }); } _sessionPool.Prune(tabs); return tabs.OrderBy(t => t.Title, StringComparer.CurrentCultureIgnoreCase).ToList(); }'''
          new = '''    public async Task<List<ChromeTab>> GetTabsAsync(CancellationToken cancellationToken = default)
    {
        try
        {
            var tabs = await GetTabsCoreAsync(cancellationToken);
            Interlocked.Exchange(ref _endpointTransportFailures, 0);
            return tabs;
        }
        catch (Exception ex) when (!cancellationToken.IsCancellationRequested && IsRecoverableMonitorTransportException(ex))
        {
            var failureCount = Interlocked.Increment(ref _endpointTransportFailures);
            if (failureCount < EndpointRecoveryFailureThreshold)
                throw;

            if (!await TryRecoverMonitorBrowserEndpointAsync(cancellationToken))
                throw;

            Interlocked.Exchange(ref _endpointTransportFailures, 0);
            return await GetTabsCoreAsync(cancellationToken);
        }
    }

    private async Task<List<ChromeTab>> GetTabsCoreAsync(CancellationToken cancellationToken)
    {
        using var response = await _httpClient.GetAsync($"{_config.DebuggingBaseUrl.TrimEnd('/')}/json/list", cancellationToken);
        response.EnsureSuccessStatusCode();
        var json = await response.Content.ReadAsStringAsync(cancellationToken);
        using var document = JsonDocument.Parse(json);
        var tabs = new List<ChromeTab>();
        foreach (var item in document.RootElement.EnumerateArray())
        {
            var type = item.TryGetProperty("type", out var typeElement) ? typeElement.GetString() ?? string.Empty : string.Empty;
            if (!string.Equals(type, "page", StringComparison.OrdinalIgnoreCase)) continue;
            tabs.Add(new ChromeTab
            {
                Id = item.TryGetProperty("id", out var id) ? id.GetString() ?? string.Empty : string.Empty,
                Title = item.TryGetProperty("title", out var title) ? title.GetString() ?? string.Empty : string.Empty,
                Url = item.TryGetProperty("url", out var url) ? url.GetString() ?? string.Empty : string.Empty,
                Type = type,
                WebSocketDebuggerUrl = item.TryGetProperty("webSocketDebuggerUrl", out var ws) ? ws.GetString() ?? string.Empty : string.Empty
            });
        }
        _sessionPool.Prune(tabs);
        return tabs.OrderBy(t => t.Title, StringComparer.CurrentCultureIgnoreCase).ToList();
    }

    private async Task<bool> TryRecoverMonitorBrowserEndpointAsync(CancellationToken cancellationToken)
    {
        if (!Uri.TryCreate(_config.DebuggingBaseUrl, UriKind.Absolute, out var endpoint) || !endpoint.IsLoopback)
            return false;

        await _endpointRecoveryGate.WaitAsync(cancellationToken);
        try
        {
            try
            {
                LaunchMonitorChrome();
            }
            catch (Exception ex) when (ex is not OperationCanceledException)
            {
                ExceptionLogService.Log(ex, "ChromeDevToolsService.EndpointRecoveryLaunch");
                return false;
            }

            for (var attempt = 1; attempt <= EndpointRecoveryProbeAttempts; attempt++)
            {
                cancellationToken.ThrowIfCancellationRequested();
                try
                {
                    await Task.Delay(EndpointRecoveryProbeDelayMs, cancellationToken);
                    _ = await GetTabsCoreAsync(cancellationToken);
                    return true;
                }
                catch (Exception ex) when (!cancellationToken.IsCancellationRequested && IsRecoverableMonitorTransportException(ex))
                {
                    if (attempt == EndpointRecoveryProbeAttempts)
                        ExceptionLogService.Log(ex, "ChromeDevToolsService.EndpointRecoveryProbe");
                }
            }
            return false;
        }
        finally
        {
            _endpointRecoveryGate.Release();
        }
    }'''
          replace_once(old, new, 'GetTabsAsync')

          replace_once(
              '    public async Task CloseAllMonitorTabsAsync(CancellationToken cancellationToken = default)\n    {\n        var trackedProcess = _monitorChromeProcess;',
              '    public async Task CloseAllMonitorTabsAsync(CancellationToken cancellationToken = default)\n    {\n        Interlocked.Exchange(ref _endpointTransportFailures, 0);\n        var trackedProcess = _monitorChromeProcess;',
              'CloseAllMonitorTabsAsync')

          start = s.index('    public async Task<bool> SendChatMessageVerifiedAsync(')
          end = s.index('    private async Task<(bool Success, int Count, string LastText)> TryGetUserMessageSnapshotAsync', start)
          s = s[:start] + '''    public async Task<bool> SendChatMessageVerifiedAsync(ChromeTab tab, string message, CancellationToken cancellationToken = default, bool requireNewTurn = false)
    {
        var expected = message.Trim();
        if (expected.Length == 0) return false;

        var deadline = DateTimeOffset.UtcNow.AddSeconds(30);
        var before = await TryGetUserMessageSnapshotAsync(tab, cancellationToken);
        while (!before.Success && DateTimeOffset.UtcNow < deadline)
        {
            await Task.Delay(250, cancellationToken);
            before = await TryGetUserMessageSnapshotAsync(tab, cancellationToken);
        }
        if (!before.Success) return false;
        if (!requireNewTurn && string.Equals(before.LastText, expected, StringComparison.Ordinal)) return true;

        var submissionFenceKey = GetDeliverySubmissionFenceKey(tab, before.Count, expected);
        var submissionIssued = HasActiveDeliverySubmissionFence(submissionFenceKey);
        while (DateTimeOffset.UtcNow < deadline)
        {
            cancellationToken.ThrowIfCancellationRequested();
            var current = await TryGetUserMessageSnapshotAsync(tab, cancellationToken);
            if (!current.Success)
            {
                await Task.Delay(250, cancellationToken);
                continue;
            }
            if (current.Count > before.Count && string.Equals(current.LastText, expected, StringComparison.Ordinal))
            {
                ClearDeliverySubmissionFence(submissionFenceKey);
                return true;
            }
            if (!submissionIssued)
            {
                try
                {
                    if (!await SendChatMessageAsync(tab, message, cancellationToken))
                    {
                        await Task.Delay(500, cancellationToken);
                        continue;
                    }
                    submissionIssued = true;
                    MarkDeliverySubmissionFence(submissionFenceKey);
                }
                catch (Exception ex) when (!cancellationToken.IsCancellationRequested && IsRecoverableMonitorTransportException(ex))
                {
                    submissionIssued = true;
                    MarkDeliverySubmissionFence(submissionFenceKey);
                    _sessionPool.Invalidate(tab.Id);
                    await Task.Delay(250, cancellationToken);
                    continue;
                }
                catch (Exception ex) when (ex is not OperationCanceledException)
                {
                    submissionIssued = true;
                    MarkDeliverySubmissionFence(submissionFenceKey);
                    ExceptionLogService.Log(ex, "ChromeDevToolsService.SendChatMessageVerified", null, tab.Id, tab.Title);
                }
            }
            await Task.Delay(300, cancellationToken);
        }
        return false;
    }

    private static string GetDeliverySubmissionFenceKey(ChromeTab tab, int baselineCount, string expected)
    {
        var targetIdentity = !string.IsNullOrWhiteSpace(tab.Url) ? tab.Url : tab.Id;
        var messageHash = Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(expected)));
        return $"{targetIdentity}|{baselineCount}|{messageHash}";
    }

    private bool HasActiveDeliverySubmissionFence(string key)
    {
        lock (_deliverySubmissionFenceSync)
        {
            PruneDeliverySubmissionFencesNoLock();
            return _deliverySubmissionFences.TryGetValue(key, out var expiresUtc) && expiresUtc > DateTimeOffset.UtcNow;
        }
    }

    private void MarkDeliverySubmissionFence(string key)
    {
        lock (_deliverySubmissionFenceSync)
        {
            PruneDeliverySubmissionFencesNoLock();
            _deliverySubmissionFences[key] = DateTimeOffset.UtcNow + DeliverySubmissionFenceLifetime;
        }
    }

    private void ClearDeliverySubmissionFence(string key)
    {
        lock (_deliverySubmissionFenceSync) _deliverySubmissionFences.Remove(key);
    }

    private void PruneDeliverySubmissionFencesNoLock()
    {
        var now = DateTimeOffset.UtcNow;
        foreach (var staleKey in _deliverySubmissionFences.Where(item => item.Value <= now).Select(item => item.Key).ToArray())
            _deliverySubmissionFences.Remove(staleKey);
    }
''' + s[end:]
          p.write_text(s, encoding='utf-8')

          Path('tests/GPTDeskTop.RuntimeTests/CdpRecoveryAndSendStormRegressionTests.cs').write_text(r'''namespace GPTDeskTop.RuntimeTests;

public sealed class CdpRecoveryAndSendStormRegressionTests
{
    private static string ReadSource()
    {
        var path = Path.GetFullPath(Path.Combine(AppContext.BaseDirectory, "..", "..", "..", "..", "..", "src", "GPTDeskTop", "Services", "ChromeDevToolsService.cs"));
        return File.ReadAllText(path);
    }

    [Fact]
    public void VerifiedDeliveryUsesAtMostOnceSubmissionFencePerUserTurnBaseline()
    {
        var source = ReadSource();
        var start = source.IndexOf("public async Task<bool> SendChatMessageVerifiedAsync", StringComparison.Ordinal);
        var end = source.IndexOf("private async Task<(bool Success, int Count, string LastText)> TryGetUserMessageSnapshotAsync", start, StringComparison.Ordinal);
        var method = source[start..end];
        Assert.Contains("GetDeliverySubmissionFenceKey(tab, before.Count, expected)", method, StringComparison.Ordinal);
        Assert.Contains("if (!submissionIssued)", method, StringComparison.Ordinal);
        Assert.Contains("MarkDeliverySubmissionFence(submissionFenceKey)", method, StringComparison.Ordinal);
        Assert.Equal(1, Count(method, "await SendChatMessageAsync(tab, message, cancellationToken)"));
    }

    [Fact]
    public void EndpointListingRecoversDedicatedLoopbackChromeAfterBoundedFailures()
    {
        var source = ReadSource();
        Assert.Contains("EndpointRecoveryFailureThreshold = 4", source, StringComparison.Ordinal);
        Assert.Contains("TryRecoverMonitorBrowserEndpointAsync", source, StringComparison.Ordinal);
        Assert.Contains("endpoint.IsLoopback", source, StringComparison.Ordinal);
        Assert.Contains("LaunchMonitorChrome();", source, StringComparison.Ordinal);
    }

    [Fact]
    public void IntentionalCloseResetsEndpointFailureCounter()
    {
        var source = ReadSource();
        var start = source.IndexOf("public async Task CloseAllMonitorTabsAsync", StringComparison.Ordinal);
        var end = source.IndexOf("public async Task<bool> TrySelectModelAsync", start, StringComparison.Ordinal);
        Assert.Contains("Interlocked.Exchange(ref _endpointTransportFailures, 0);", source[start..end], StringComparison.Ordinal);
    }

    private static int Count(string source, string value)
    {
        var count = 0;
        for (var offset = 0; (offset = source.IndexOf(value, offset, StringComparison.Ordinal)) >= 0; offset += value.Length) count++;
        return count;
    }
}
''', encoding='utf-8')

          Path('.github/workflows/apply-cdp-send-storm-hotfix.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover CDP endpoint and suppress send storms"
          git push origin fix-cdp-send-storm

      - name: Remove one-shot workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/one-shot-cdp-send-storm-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-shot hotfix workflow [skip ci]"
          git push origin main
