name: SENDHEAL follow-up patch

on:
  push:
    branches:
      - agent/send-cdp-self-heal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/send-cdp-self-heal
          fetch-depth: 0
      - name: Apply post-submit hydration guard
        run: python .github/scripts/apply_sendheal_followup.py
      - name: Commit follow-up and remove tooling
        run: |
          git rm .github/workflows/sendheal-followup.yml .github/scripts/apply_sendheal_followup.py
          git add src/GPTDeskTop/Services/ChromeDevToolsService.cs tests/GPTDeskTop.RuntimeTests/VerifiedSendTaskCancellationSelfHealRegressionTests.cs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "SENDHEAL: defer post-submit turn mismatch to stable reconciliation"
          git push origin HEAD:agent/send-cdp-self-heal
