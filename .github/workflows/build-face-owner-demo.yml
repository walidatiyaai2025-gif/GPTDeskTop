name: Build Face Owner Demo APK

on:
  pull_request:
    paths:
      - 'face-owner-demo/**'
      - '.github/workflows/build-face-owner-demo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p face-owner-demo :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceOwnerDemo-debug-apk
          path: face-owner-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
