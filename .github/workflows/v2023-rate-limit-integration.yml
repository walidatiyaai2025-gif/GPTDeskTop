name: Apply v2.0.23 Monitor Only Rate Limit Safety

on:
  push:
    branches:
      - worker/monitor-only-rate-limit-v2023
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply source integration
        run: python scripts/apply_v2023_rate_limit_hotfix.py

      - name: Remove one-shot integration helpers
        run: |
          rm scripts/apply_v2023_rate_limit_hotfix.py
          rm .github/workflows/v2023-rate-limit-integration.yml

      - name: Commit integrated v2.0.23 source
        run: |
          set -euo pipefail
          git config user.name "gptdesktop-v2023-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(monitor-only): durable rate-limit and persistent send gate v2.0.23"
          git push origin HEAD:worker/monitor-only-rate-limit-v2023
