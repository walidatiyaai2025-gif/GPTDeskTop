name: GPTDeskTop v2.0.8 Fresh Chat CDP Anchor

on:
  push:
    branches:
      - hotfix/v208-fresh-chat-cdp-anchor

permissions:
  contents: write

# Exact-head validation trigger after the one-shot source mutation has been committed.
jobs:
  patch-validate-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: hotfix/v208-fresh-chat-cdp-anchor
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply one-shot v2.0.8 fresh-chat target anchor
        id: patch
        shell: pwsh
        run: |
          if (Test-Path 'tools/apply_v208_fresh_chat_cdp_anchor.py') {
            python tools/apply_v208_fresh_chat_cdp_anchor.py
            $service = Get-Content 'src/GPTDeskTop/Services/ChromeDevToolsService.cs' -Raw
            $app = Get-Content 'src/GPTDeskTop/GPTDeskTop.csproj' -Raw
            if (!$service.Contains('fresh-chat-target-anchor')) { throw 'Fresh-chat exact-target transport anchor was not written.' }
            if (!$service.Contains('var originalTargetId = tab.Id')) { throw 'Fresh-chat target identity guard is missing.' }
            if (!$app.Contains('<Version>2.0.8</Version>')) { throw 'Application version is not 2.0.8 after patch.' }
            git config user.name "gptdesktop-runtime-worker"
            git config user.email "actions@users.noreply.github.com"
            git rm tools/apply_v208_fresh_chat_cdp_anchor.py
            git add src tests
            if (git status --porcelain) {
              git commit -m "fix(runtime): allow verified send on newly created ChatGPT targets"
              git push origin HEAD:hotfix/v208-fresh-chat-cdp-anchor
              "changed=true" >> $env:GITHUB_OUTPUT
            } else {
              "changed=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Defer validation to exact committed source
        if: steps.patch.outputs.changed == 'true'
        shell: pwsh
        run: Write-Host 'v2.0.8 source committed. Push-triggered exact-head run will validate and package.'

      - name: Setup .NET 8
        if: steps.patch.outputs.changed == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet restore GPTDeskTop.sln

      - name: Focused fresh-chat transport regression tests
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --filter "FullyQualifiedName~FreshChatTransportAnchorRegressionTests|FullyQualifiedName~FreshChatPerResponseRegressionTests|FullyQualifiedName~CdpTransportStabilityRegressionTests|FullyQualifiedName~PhysicalSubmitAcceptanceRegressionTests|FullyQualifiedName~VerifiedSendTransportRecoveryRegressionTests" --logger "trx;LogFileName=v208-fresh-chat-anchor.trx"

      - name: Full runtime and product suite
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet test tests/GPTDeskTop.RuntimeTests/GPTDeskTop.RuntimeTests.csproj -c Release --no-restore --logger "trx;LogFileName=v208-full-runtime.trx"

      - name: Release x64 build
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet build src/GPTDeskTop/GPTDeskTop.csproj -c Release -r win-x64

      - name: Build final Setup EXE
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: dotnet build src/GPTDeskTop.Setup/GPTDeskTop.Setup.csproj -c Release -p:RunPackagingTargets=true

      - name: Verify exact head and package final source
        if: steps.patch.outputs.changed == 'false'
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor 9fa8109a1ae8983a32c9f5559b62efff2b7262de HEAD
          if ($LASTEXITCODE -ne 0) { throw 'v2.0.8 source lost v2.0.7 ancestry.' }
          if (Test-Path 'tools/apply_v208_fresh_chat_cdp_anchor.py') { throw 'One-shot patch applicator leaked into final source.' }
          $service = Get-Content 'src/GPTDeskTop/Services/ChromeDevToolsService.cs' -Raw
          $monitor = Get-Content 'src/GPTDeskTop/Services/ChatGptMonitorService.cs' -Raw
          $app = Get-Content 'src/GPTDeskTop/GPTDeskTop.csproj' -Raw
          $setupProgram = Get-Content 'src/GPTDeskTop.Setup/Program.cs' -Raw
          if (!$app.Contains('<Version>2.0.8</Version>')) { throw 'Application version is not 2.0.8.' }
          if (!$setupProgram.Contains('Version = "2.0.8"')) { throw 'Setup program version constant is not 2.0.8.' }
          if (!$service.Contains('fresh-chat-target-anchor')) { throw 'Final source lacks fresh-chat exact-target transport anchor.' }
          if (!$service.Contains('string.Equals(candidate.Id, originalTargetId, StringComparison.Ordinal)')) { throw 'Final source lacks exact-target fresh-chat binding.' }
          if (!$monitor.Contains('ContinueInFreshChatAfterResponseAsync')) { throw 'Final source lost fresh-chat-per-response behavior.' }
          if ($monitor.Contains('var autoSent = await SendWhenReadyAsync(monitor.Id, tab, monitor.AutoReply')) { throw 'Legacy same-chat auto reply returned.' }
          $exe = 'Output/Setup/GPTDeskTop-Setup.exe'
          if (!(Test-Path $exe)) { throw 'Setup EXE missing.' }
          $setupSha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $exe).Length
          git archive --format=zip --output GPTDeskTop-v2.0.8-FINAL-SOURCE.zip HEAD
          $sourceSha = (Get-FileHash GPTDeskTop-v2.0.8-FINAL-SOURCE.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "FINAL_HEAD=$head`nBASE_V207_HEAD=9fa8109a1ae8983a32c9f5559b62efff2b7262de`nVERSION=2.0.8`nBEHAVIOR=FRESH_CHAT_EXACT_TARGET_PRE_FIRST_TURN`nSETUP_SHA256=$setupSha`nSETUP_SIZE=$setupSize`nSOURCE_ZIP_SHA256=$sourceSha" | Set-Content FINAL-V208-IDENTITY.txt
          Write-Host "FINAL_HEAD=$head"
          Write-Host "SETUP_SHA256=$setupSha"
          Write-Host "SOURCE_ZIP_SHA256=$sourceSha"

      - name: Upload v2.0.8 final source
        if: steps.patch.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.8-FINAL-SOURCE
          path: |
            GPTDeskTop-v2.0.8-FINAL-SOURCE.zip
            FINAL-V208-IDENTITY.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload v2.0.8 final setup
        if: steps.patch.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GPTDeskTop-v2.0.8-FINAL-SETUP
          path: |
            Output/Setup/GPTDeskTop-Setup.exe
            Output/Setup/Version.txt
            FINAL-V208-IDENTITY.txt
          if-no-files-found: error
          retention-days: 30
